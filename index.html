<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მიშნა ქართულად</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 font-sans">

    <div class="max-w-xl mx-auto space-y-4">
        
        <!-- მართვისა და ფილტრების ბლოკი -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
            
            <!-- ძიება -->
            <div class="relative">
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="handleSearch()"
                    placeholder="🔍 მოძებნე მიშნა, სიტყვა ან თემა..." 
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-500 transition"
                >
            </div>

            <!-- ფილტრები: სედერი, ტრაქტატი, თავი -->
            <div class="grid grid-cols-3 gap-2">
                <select id="sederSelect" onchange="onSederChange()" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-xl p-2 focus:outline-none focus:border-blue-500 font-semibold">
                    <option value="">ყველა სედერი</option>
                </select>

                <select id="masekhetSelect" onchange="onMasekhetChange()" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-xl p-2 focus:outline-none focus:border-blue-500 font-semibold" disabled>
                    <option value="">ყველა ტრაქტატი</option>
                </select>

                <select id="perekSelect" onchange="onPerekChange()" class="bg-slate-50 border border-slate-300 text-slate-700 text-xs rounded-xl p-2 focus:outline-none focus:border-blue-500 font-semibold" disabled>
                    <option value="">ყველა თავი</option>
                </select>
            </div>

            <!-- დღის მიშნა და ფილტრების გასუფთავება -->
            <div class="flex gap-2">
                <button 
                    onclick="showDailyMishna()" 
                    class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs py-2.5 px-3 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5"
                >
                    <span>📅</span>
                    <span>დღის მიშნა</span>
                </button>
                
                <button 
                    id="resetBtn" 
                    onclick="resetFilters()" 
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs py-2.5 px-4 rounded-xl transition"
                >
                    ↺ გასუფთავება
                </button>
            </div>
        </div>

        <!-- მიშნების სია -->
        <div id="app" class="space-y-6">
            <div id="loading" class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-amber-500 border-t-transparent mb-2"></div>
                <p class="text-sm font-bold text-slate-500">მიშნები იტვირთება...</p>
            </div>
        </div>

    </div>

    <script>
        const SHEET_ID = '1fjSotzWwWe7MYtSwzB4hIOssgZFApM3_ZYOUIK9KE4Q';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

        const MISHNA_STRUCTURE = {
            "ზერაიმი (זרעים)": {
                "ბერახოთი (ברכות)": 9,
                "ფეა (פאה)": 8,
                "დმაი (דמאי)": 7,
                "ქილაიმი (כלאים)": 9,
                "შევიითი (שביעית)": 10,
                "თრუმოთი (תרומות)": 11,
                "მაასროთი (מעשרות)": 5,
                "მაასერ შენი (מעשר שני)": 5,
                "ხალა (חלה)": 4,
                "ორლა (ערלה)": 3,
                "ბიქურიმი (ביכורים)": 4
            },
            "მოედი (מועד)": {
                "შაბათი (שבת)": 24,
                "ერუვინი (עירובין)": 10,
                "ფესახიმი (פסחים)": 10,
                "შექალიმი (שקלים)": 8,
                "იომა (יומא)": 8,
                "სუქა (סוכה)": 5,
                "ბეცა (ביצה)": 5,
                "როშ ჰაშანა (ראש השנה)": 4,
                "თაანიტი (תענית)": 4,
                "მეგილა (מגילה)": 4,
                "მოედ ქატანი (מועד קטן)": 3,
                "ხაგიგა (חגיגה)": 3
            },
            "ნაშიმი (נשים)": {
                "იევამოთი (יבמות)": 16,
                "ქეთუბოთი (כתובות)": 13,
                "ნედარიმი (נדרים)": 11,
                "ნაზირი (ნזיר)": 9,
                "სოტა (სוטה)": 9,
                "გიტინი (גיטין)": 9,
                "ქიდუშინი (קידושין)": 4
            },
            "ნეზიკინი (נזיקין)": {
                "ბავა კამა (בבא קמא)": 10,
                "ბავა მეცია (בבא מציעא)": 10,
                "ბავა ბათრა (בבא בתרא)": 10,
                "სანჰედრინი (סנהדרין)": 11,
                "მაქოთი (מכות)": 3,
                "შევუოთი (שבועות)": 8,
                "ედუიოთი (עדויות)": 8,
                "ყავოდა ზარა (עבודה זרה)": 5,
                "ავოთი / პირქე ავოთი (אבות)": 6,
                "ჰორაიოთი (הוריות)": 3
            },
            "ქოდაშიმი (קדשים)": {
                "ზებახიმი (זבחים)": 14,
                "მენახოთი (მנחות)": 13,
                "ხულინი (חולין)": 12,
                "ბექოროთი (בכורות)": 9,
                "არაქინი (ערכין)": 9,
                "თემურა (תמורה)": 7,
                "ქრითოთი (כריתות)": 6,
                "მეილა (מעילה)": 6,
                "თამიდი (თמיד)": 7,
                "მიდოთი (მიדות)": 5,
                "ქინემი (קינים)": 3
            },
            "თოჰოროთი (טהרות)": {
                "ქელიმი (כלים)": 30,
                "ოჰოლოტი (אהלות)": 18,
                "ნეგაიმი (נגעים)": 14,
                "ფარა (פרה)": 12,
                "თოჰოროთი (טהרות)": 10,
                "მიქვაოთი (מקוואות)": 10,
                "ნიდა (נדה)": 10,
                "მახშირინი (מכשירין)": 6,
                "ზავიמי (זבים)": 5,
                "თევულ იომი (טבול יום)": 4,
                "იადაიმი (ידיים)": 4,
                "უქცინი (עוקצין)": 3
            }
        };

        let allMishnayot = [];

        function cleanString(str) {
            if (!str) return '';
            return str.toString()
                      .replace(/\(.*\)/g, '')
                      .replace(/[\u0590-\u05FF]/g, '')
                      .toLowerCase()
                      .trim();
        }

        async function fetchMishnaData() {
            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;

                allMishnayot = [];

                rows.forEach((row, index) => {
                    const data = row.c;
                    if (!data || !data[0]) return; 

                    allMishnayot.push({
                        id: index,
                        seder: (data[1]?.v || '').toString().trim(),
                        masekhet: (data[2]?.v || '').toString().trim(),
                        perek: (data[3]?.v || '').toString().trim(),
                        mishna: (data[4]?.v || '').toString().trim(),
                        hebrew: data[5]?.v || '',
                        transliteration: data[6]?.v || '',
                        georgian: data[7]?.v || '',
                        kehati: data[8]?.v || '',
                        bartenura: data[9]?.v || ''
                    });
                });

                populateSederDropdown();
                renderMishnayot(allMishnayot);
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <p class="text-red-500 font-bold">შეცდომა მონაცემების ჩატვირთვისას!</p>
                `;
            }
        }

        function populateSederDropdown() {
            const sederSelect = document.getElementById('sederSelect');
            sederSelect.innerHTML = '<option value="">ყველა სედერი</option>';
            
            Object.keys(MISHNA_STRUCTURE).forEach(seder => {
                sederSelect.innerHTML += `<option value="${seder}">${seder}</option>`;
            });
        }

        function onSederChange() {
            const selectedSeder = document.getElementById('sederSelect').value;
            const masekhetSelect = document.getElementById('masekhetSelect');
            const perekSelect = document.getElementById('perekSelect');

            perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
            perekSelect.disabled = true;

            if (!selectedSeder || !MISHNA_STRUCTURE[selectedSeder]) {
                masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
                masekhetSelect.disabled = true;
                applyFilters();
                return;
            }

            const masekhtot = Object.keys(MISHNA_STRUCTURE[selectedSeder]);
            masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
            masekhtot.forEach(m => {
                masekhetSelect.innerHTML += `<option value="${m}">${m}</option>`;
            });
            masekhetSelect.disabled = false;

            applyFilters();
        }

        function onMasekhetChange() {
            const selectedSeder = document.getElementById('sederSelect').value;
            const selectedMasekhet = document.getElementById('masekhetSelect').value;
            const perekSelect = document.getElementById('perekSelect');

            if (!selectedMasekhet || !MISHNA_STRUCTURE[selectedSeder] || !MISHNA_STRUCTURE[selectedSeder][selectedMasekhet]) {
                perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
                perekSelect.disabled = true;
                applyFilters();
                return;
            }

            const totalPerakim = MISHNA_STRUCTURE[selectedSeder][selectedMasekhet];
            perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
            
            for (let i = 1; i <= totalPerakim; i++) {
                perekSelect.innerHTML += `<option value="${i}">თავი ${i}</option>`;
            }
            perekSelect.disabled = false;

            applyFilters();
        }

        function onPerekChange() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedSeder = document.getElementById('sederSelect').value;
            const selectedMasekhet = document.getElementById('masekhetSelect').value;
            const selectedPerek = document.getElementById('perekSelect').value;

            let filtered = allMishnayot;

            if (selectedSeder) {
                const cleanSelectedSeder = cleanString(selectedSeder);
                filtered = filtered.filter(m => cleanString(m.seder).includes(cleanSelectedSeder) || cleanSelectedSeder.includes(cleanString(m.seder)));
            }
            if (selectedMasekhet) {
                const cleanSelectedMasekhet = cleanString(selectedMasekhet);
                filtered = filtered.filter(m => cleanString(m.masekhet).includes(cleanSelectedMasekhet) || cleanSelectedMasekhet.includes(cleanString(m.masekhet)));
            }
            if (selectedPerek) {
                filtered = filtered.filter(m => m.perek.toString() === selectedPerek.toString());
            }

            if (query) {
                filtered = filtered.filter(item => 
                    item.georgian.toLowerCase().includes(query) ||
                    item.hebrew.includes(query) ||
                    item.transliteration.toLowerCase().includes(query) ||
                    item.kehati.toLowerCase().includes(query) ||
                    item.bartenura.toLowerCase().includes(query)
                );
            }

            renderMishnayot(filtered);
        }

        function handleSearch() {
            applyFilters();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('sederSelect').value = '';
            
            const masekhetSelect = document.getElementById('masekhetSelect');
            masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
            masekhetSelect.disabled = true;

            const perekSelect = document.getElementById('perekSelect');
            perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
            perekSelect.disabled = true;

            renderMishnayot(allMishnayot);
        }

        function renderMishnayot(list, isDaily = false) {
            const app = document.getElementById('app');
            app.innerHTML = ''; 

            if (list.length === 0) {
                app.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
                        <p class="text-3xl mb-2">📚</p>
                        <p class="text-sm font-bold text-slate-700 mb-1">ტექსტი ჯერ არ არის დამატებული</p>
                        <p class="text-xs text-slate-500">ამ არჩეული თავის/ტრაქტატის თარგმანი მალე დაემატება ბაზაში.</p>
                    </div>
                `;
                return;
            }

            list.forEach(item => {
                app.appendChild(createMishnaCard(item, isDaily));
            });
        }

        function createMishnaCard(item, isDaily) {
            const card = document.createElement('div');
            card.className = `bg-white rounded-2xl shadow-md overflow-hidden p-5 border ${isDaily ? 'border-amber-400 ring-2 ring-amber-300' : 'border-slate-200'} mb-6 relative`;
            
            card.innerHTML = `
                ${isDaily ? `<span class="absolute top-3 right-3 bg-amber-500 text-white text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full shadow-sm">დღის მიშნა</span>` : ''}

                <!-- სათაური -->
                <div class="text-center mb-6">
                    <span class="text-xs font-bold text-blue-600 uppercase tracking-widest">${item.seder}</span>
                    <h1 class="text-2xl font-extrabold text-slate-800 mt-1">ტრაქტატი ${item.masekhet}</h1>
                    <p class="text-xs text-slate-500 font-semibold mt-1">თავი ${item.perek} • მიშნა ${item.mishna}</p>
                </div>

                <!-- ებრაული ორიგინალი -->
                <div dir="rtl" class="bg-amber-50/60 border-r-4 border-amber-500 p-4 rounded-xl mb-3">
                    <span class="text-[10px] font-bold text-amber-700 block mb-1">מקור (ორიგინალი)</span>
                    <p class="text-xl font-serif text-slate-900 leading-relaxed">${item.hebrew}</p>
                </div>

                <!-- ტრანსლიტერაცია -->
                ${item.transliteration ? `
                <div class="bg-slate-50 border-l-4 border-slate-400 p-3 rounded-xl mb-3">
                    <span class="text-[10px] font-bold text-slate-500 block mb-1">ტრანსლიტერაცია (წაკითხვა)</span>
                    <p class="text-xs italic text-slate-700 leading-relaxed">${item.transliteration}</p>
                </div>
                ` : ''}

                <!-- ქართული თარგმანი -->
                <div class="bg-emerald-50/60 border-l-4 border-emerald-500 p-4 rounded-xl mb-6">
                    <span class="text-[10px] font-bold text-emerald-700 block mb-1">ქართული თარგმანი</span>
                    <p class="text-sm text-slate-800 leading-relaxed">${item.georgian}</p>
                </div>

                <!-- განმარტებები -->
                <div class="border border-slate-200 rounded-xl overflow-hidden">
                    <div class="flex border-b border-slate-200 bg-slate-50">
                        <button onclick="switchTab(${item.id}, 'bartenura')" id="tab-bartenura-${item.id}" class="flex-1 py-3 text-xs font-bold text-purple-600 border-b-2 border-purple-500 bg-white">
                            📜 რაბი ყოვადია ბარტანურა
                        </button>
                        <button onclick="switchTab(${item.id}, 'kehati')" id="tab-kehati-${item.id}" class="flex-1 py-3 text-xs font-bold text-slate-500 hover:text-orange-600">
                            📖 რაბინ პინხას კეჰათი
                        </button>
                    </div>

                    <div class="p-4 bg-white text-xs leading-relaxed text-slate-600">
                        <div id="content-bartenura-${item.id}">
                            <strong class="block text-purple-600 mb-1">რაბი ყოვადია ბარტანურას განმარტება:</strong>
                            ${item.bartenura || 'განმარტება არ არის.'}
                        </div>
                        <div id="content-kehati-${item.id}" class="hidden">
                            <strong class="block text-orange-600 mb-1">რაბინ პინხას კეჰატის განმარტება:</strong>
                            ${item.kehati || 'განმარტება არ არის.'}
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        function showDailyMishna() {
            if (allMishnayot.length === 0) return;

            const now = new Date();
            const startOfYear = new Date(now.getFullYear(), 0, 0);
            const diff = now - startOfYear;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);

            const dailyIndex = dayOfYear % allMishnayot.length;
            const dailyMishna = allMishnayot[dailyIndex];

            renderMishnayot([dailyMishna], true);
        }

        function switchTab(id, tab) {
            const kehatiContent = document.getElementById(`content-kehati-${id}`);
            const bartenuraContent = document.getElementById(`content-bartenura-${id}`);
            const kehatiTab = document.getElementById(`tab-kehati-${id}`);
            const bartenuraTab = document.getElementById(`tab-bartenura-${id}`);

            if (tab === 'bartenura') {
                bartenuraContent.classList.remove('hidden');
                kehatiContent.classList.add('hidden');
                bartenuraTab.className = "flex-1 py-3 text-xs font-bold text-purple-600 border-b-2 border-purple-500 bg-white";
                kehatiTab.className = "flex-1 py-3 text-xs font-bold text-slate-500 hover:text-orange-600";
            } else {
                kehatiContent.classList.remove('hidden');
                bartenuraContent.classList.add('hidden');
                kehatiTab.className = "flex-1 py-3 text-xs font-bold text-orange-600 border-b-2 border-orange-500 bg-white";
                bartenuraTab.className = "flex-1 py-3 text-xs font-bold text-slate-500 hover:text-purple-600";
            }
        }

        fetchMishnaData();
    </script>
</body>
</html>
