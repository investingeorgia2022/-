<!DOCTYPE html>
<html lang="ka" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მიშნა ქართულად Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        .dynamic-text-hebrew { font-size: calc(1.25rem * var(--text-scale, 1)); }
        .dynamic-text-georgian { font-size: calc(0.875rem * var(--text-scale, 1)); }
        .dynamic-text-trans { font-size: calc(0.75rem * var(--text-scale, 1)); }
        .dynamic-text-commentary { font-size: calc(0.75rem * var(--text-scale, 1)); }
        
        #stickyHeader { transition: transform 0.3s ease; }
        .header-hidden { transform: translateY(-160%) !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .mishna-card { animation: fadeIn 0.25s ease-out forwards; }
        
        .oled-black { background-color: #000000 !important; }
        .oled-black .mishna-card, .oled-black #stickyHeader, .oled-black .modal-bg { background-color: #0a0a0a !important; border-color: #222 !important; }
        
        .flip-card { perspective: 1000px; }
        .flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { backface-visibility: hidden; }
        .flip-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 font-sans pt-72 sm:pt-60 transition-colors duration-300">

    <div class="max-w-xl mx-auto space-y-4">
        
        <!-- HEADER -->
        <div id="stickyHeader" class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-md border border-slate-200 dark:border-slate-700 space-y-3 fixed top-2 left-4 right-4 max-w-xl mx-auto z-40 transition-colors duration-300">
            
            <!-- STREAK BANNER -->
            <div id="streakBanner" class="bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-1.5 flex items-center justify-between text-xs">
                <span id="streakText" class="text-amber-600 dark:text-amber-400 font-extrabold">🔥 0 დღიანი სერია</span>

                    <button onclick="toggleFavoritesFilter()" id="favFilterBtn" title="ფავორიტები" class="w-8 h-8 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs shadow-sm">❤️</button>

            <!-- SEARCH & FONT -->
            <div class="flex gap-2">

                    <button onclick="changeFontSize(-0.1)" class="w-6 h-6 bg-white dark:bg-slate-800 rounded text-xs font-bold">A-</button>
                    <button onclick="changeFontSize(0.1)" class="w-6 h-6 bg-white dark:bg-slate-800 rounded text-xs font-bold">A+</button>

            <!-- SELECTORS -->
            <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
                <select id="sederSelect" onchange="onSederChange()" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-xl p-1.5 font-semibold"><option value="">ყველა სედერი</option></select>

                <select id="perekSelect" onchange="onPerekChange()" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-xl p-1.5 font-semibold" disabled><option value="">ყველა თავი</option></select>
                <select id="mishnaSelect" onchange="applyFilters()" class="bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-xl p-1.5 font-semibold" disabled><option value="">ყველა მიშნა</option></select>
            </div>

            <!-- PROGRESS -->
            <div class="space-y-1">
                <div class="flex justify-between text-[10px] font-bold text-slate-500">
                    <span id="progressTitle">პროგრესი</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                    <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all"></div>
                </div>

        </div>

        <div id="app" class="space-y-6 pt-2">
            <div id="loading" class="text-center py-12"><p class="text-sm font-bold text-slate-500">იტვირთება...</p></div>
        </div>

    </div>

    <!-- MODAL CONTAINER (QUIZ & FLASHCARDS) -->
    <div id="modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div id="modalContent" class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-5 relative border border-slate-200 dark:border-slate-700 shadow-2xl modal-bg">
            <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 font-bold">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

<script>
if ('serviceWorker' in navigator) {
    const swCode = `
        self.addEventListener('install', e => e.waitUntil(caches.open('mishna-v1').then(c => c.addAll(['/']))));
        self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

const SHEET_ID = '1fjSotzWwWe7MYtSwzB4hIOssgZFApM3_ZYOUIK9KE4Q';
const DIRECT_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const PROXY_URL = `https://corsproxy.io/?${encodeURIComponent(DIRECT_CSV_URL)}`;

const MISHNA_STRUCTURE = {
    "ზერაყიმი (זרעים)": { "ბერახოთი (ברכות)": { 1: 5, 2: 8, 3: 6, 4: 7, 5: 5, 6: 8, 7: 5, 8: 8, 9: 5 }, "ფეა (פאה)": 8, "დმაი (דמאי)": 7, "ქილაყიმი (כלאים)": 9, "შევიყითი (שביעית)": 10, "თრუმოთი (תרומות)": 11, "მაყასროთი (מעשרות)": 5, "მაყასერ შენი (מעשר שני)": 5, "ხალა (חלה)": 4, "ყორლა (ערלה)": 3, "ბიქურიმი (ביכורים)": 4 },
    "მოყედი (מועד)": { "შაბათი (שבת)": 24, "ყერუვინი (עירובין)": 10, "ფესახიმი (פסחים)": 10, "შეკალიმი (שקלים)": 8, "იომა (יומא)": 8, "სუქა (סוכה)": 5, "ბეცა (ביצה)": 5, "როშ ჰაშანა (ראש השנה)": 4, "თაყანითი (תענית)": 4, "მეგილა (מגילה)": 4, "მოყედ კატანი (מועד קטן)": 3, "ხაგიგა (חגיגה)": 3 },
    "ნაშიმი (נשים)": { "იევამოთი (יבמות)": 16, "ქეთუბოთი (כתובות)": 13, "ნედარიმი (נדרים)": 11, "ნაზირი (נזיר)": 9, "სოტა (סოტა)": 9, "გიტინი (גיטין)": 9, "ქიდუშინი (קידושין)": 4 },
    "ნეზიკინი (נזיקין)": { "ბავა კამა (בבא קמא)": 10, "ბავა მეციყა (בבא מציעא)": 10, "ბავა ბათრა (בבא בתרא)": 10, "სანჰედრინი (סנהדרין)": 11, "მაქოთი (מכות)": 3, "შევუოთი (שבועות)": 8, "ყედუიოთი (עדויות)": 8, "ყავოდა ზარა (עבודה זרה)": 5, "ავოთი / პირქე ავოთი (אבות)": 6, "ჰორაიოთი (הוריות)": 3 },
    "კოდაშიმი (קדשים)": { "ზებახიმი (זבחים)": 14, "მენახოთი (מנחות)": 13, "ხულინი (חולין)": 12, "ბექოროთი (בכורות)": 9, "ყარაქინი (ערכין)": 9, "თემურა (תמורה)": 7, "ქრითოთი (כריתות)": 6, "მეყილა (מעילה)": 6, "თამიდი (תאמיד)": 7, "მიדოთი (מידות)": 5, "კინემი (קינים)": 3 },
    "ტაჰაროთი (טהרות)": { "ქელიმი (כלים)": 30, "ოჰოლოტი (אהלות)": 18, "ნეგაყიმი (נגעים)": 14, "ფარა (פרה)": 12, "ტაჰაროთი (טהרות)": 10, "მიქვაოთი (מקוואות)": 10, "ნიდა (נדה)": 10, "მახშირინი (מכשירין)": 6, "ზાવીმი (זבים)": 5, "ტევულ იომი (טבול יום)": 4, "იადაყიმი (ידיים)": 4, "ყუქצინი (עוקצין)": 3 }
};

let allMishnayot = [];
let fontScale = parseFloat(localStorage.getItem('mishnaFontScale')) || 1;
let favorites = JSON.parse(localStorage.getItem('mishnaFavorites')) || [];
let userNotes = JSON.parse(localStorage.getItem('mishnaNotes')) || {};
let userHighlights = JSON.parse(localStorage.getItem('mishnaHighlights')) || {};
let readHistory = JSON.parse(localStorage.getItem('mishnaReadHistory')) || [];
let themeMode = localStorage.getItem('mishnaTheme') || 'light'; 
let showOnlyFavorites = false;

function applyTheme() {
    document.documentElement.classList.remove('dark', 'oled-black');
    if (themeMode === 'dark') document.documentElement.classList.add('dark');
    if (themeMode === 'oled') {
        document.documentElement.classList.add('dark', 'oled-black');
    }
    localStorage.setItem('mishnaTheme', themeMode);
}
applyTheme();

function cycleTheme() {
    if (themeMode === 'light') themeMode = 'dark';
    else if (themeMode === 'dark') themeMode = 'oled';
    else themeMode = 'light';
    applyTheme();
}
</script>
<script>
function speakHebrew(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel(); // Stop current speech
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'he-IL';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
}

function checkStreak() {
    const today = new Date().toISOString().split('T')[0];
    let streakData = JSON.parse(localStorage.getItem('mishnaStreak')) || { count: 0, lastDate: '' };
    
    if (streakData.lastDate) {
        const last = new Date(streakData.lastDate);
        const curr = new Date(today);
        const diffDays = Math.round((curr - last) / (1000 * 3600 * 24));
        if (diffDays > 1) streakData.count = 0;
    }
    document.getElementById('streakText').innerText = `🔥 ${streakData.count} დღიანი სერია`;
    document.getElementById('statsSummary').innerText = `წაკითხულია: ${readHistory.length}`;
}

function markAsRead(id) {
    if (!readHistory.includes(id)) {
        readHistory.push(id);
        localStorage.setItem('mishnaReadHistory', JSON.stringify(readHistory));
        
        const today = new Date().toISOString().split('T')[0];
        let streakData = JSON.parse(localStorage.getItem('mishnaStreak')) || { count: 0, lastDate: '' };
        if (streakData.lastDate !== today) {
            streakData.count += 1;
            streakData.lastDate = today;
            localStorage.setItem('mishnaStreak', JSON.stringify(streakData));
        }
        checkStreak();
    }
}

function saveNote(id, text) {
    userNotes[id] = text;
    localStorage.setItem('mishnaNotes', JSON.stringify(userNotes));
}

function toggleHighlight(id) {
    userHighlights[id] = !userHighlights[id];
    localStorage.setItem('mishnaHighlights', JSON.stringify(userHighlights));
    applyFilters();
}

function parseCSV(text) {
    const lines = []; let row = []; let inQuotes = false; let currentStr = '';
    for (let i = 0; i < text.length; i++) {
        const char = text[i], nextChar = text[i + 1];
        if (char === '"') {
            if (inQuotes && nextChar === '"') { currentStr += '"'; i++; } 
            else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
            row.push(currentStr.trim()); currentStr = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') i++;
            row.push(currentStr.trim());
            if (row.length > 1 || row[0] !== '') lines.push(row);
            row = []; currentStr = '';
        } else { currentStr += char; }
    }
    if (row.length > 0 || currentStr !== '') { row.push(currentStr.trim()); lines.push(row); }
    return lines;
}

async function fetchMishnaData() {
    let csvText = '';
    try {
        const res = await fetch(PROXY_URL);
        if (res.ok) csvText = await res.text();
    } catch (e) {}

    if (!csvText) {
        try {
            const res = await fetch(DIRECT_CSV_URL);
            if (res.ok) csvText = await res.text();
        } catch (e) {}
    }

    if (!csvText) {
        document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold">⚠️ მონაცემები ვერ ჩაიტვირთა.</p>';
        return;
    }

    const rows = parseCSV(csvText);
    allMishnayot = [];

    for (let i = 1; i < rows.length; i++) {
        const data = rows[i];
        if (!data || data.length < 3) continue;

        allMishnayot.push({
            id: i,
            seder: (data[1] || data[0] || '').trim(),
            masekhet: (data[2] || '').trim(),
            perek: (data[3] || '').trim(),
            mishna: (data[4] || '').trim(),
            hebrew: data[5] || '',
            transliteration: data[6] || '',
            georgian: data[7] || '',
            kehati: data[8] || '',
            bartenura: data[9] || ''
        });
    }

    populateSederDropdown();
    checkStreak();
    applyFilters();
}

function cleanString(str) { return str ? str.toString().replace(/[\u0591-\u05C7]/g, '').toLowerCase().trim() : ''; }

function populateSederDropdown() {
    const sederSelect = document.getElementById('sederSelect');
    sederSelect.innerHTML = '<option value="">ყველა სედერი</option>';
    Object.keys(MISHNA_STRUCTURE).forEach(seder => { sederSelect.innerHTML += `<option value="${seder}">${seder}</option>`; });
}

function onSederChange() {
    const selectedSeder = document.getElementById('sederSelect').value;
    const masekhetSelect = document.getElementById('masekhetSelect');
    masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
    if (selectedSeder && MISHNA_STRUCTURE[selectedSeder]) {
        Object.keys(MISHNA_STRUCTURE[selectedSeder]).forEach(m => masekhetSelect.innerHTML += `<option value="${m}">${m}</option>`);
        masekhetSelect.disabled = false;
    } else { masekhetSelect.disabled = true; }
    applyFilters();
}

function onMasekhetChange() {
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const perekSelect = document.getElementById('perekSelect');
    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
    if (selectedMasekhet && MISHNA_STRUCTURE[selectedSeder]?.[selectedMasekhet]) {
        const mData = MISHNA_STRUCTURE[selectedSeder][selectedMasekhet];
        let total = typeof mData === 'object' ? Object.keys(mData).length : mData;
        for (let i = 1; i <= total; i++) perekSelect.innerHTML += `<option value="${i}">თავი ${i}</option>`;
        perekSelect.disabled = false;
    } else { perekSelect.disabled = true; }
    applyFilters();
}

function onPerekChange() {
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const selectedPerek = document.getElementById('perekSelect').value;
    const mishnaSelect = document.getElementById('mishnaSelect');
    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    if (selectedPerek) {
        let max = MISHNA_STRUCTURE[selectedSeder]?.[selectedMasekhet]?.[selectedPerek] || 10;
        for (let i = 1; i <= max; i++) mishnaSelect.innerHTML += `<option value="${i}">მიშნა ${i}</option>`;
        mishnaSelect.disabled = false;
    } else { mishnaSelect.disabled = true; }
    applyFilters();
}

function toggleFavoritesFilter() {
    showOnlyFavorites = !showOnlyFavorites;
    document.getElementById('favFilterBtn').classList.toggle('bg-rose-500', showOnlyFavorites);
    document.getElementById('favFilterBtn').classList.toggle('text-white', showOnlyFavorites);
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const seder = document.getElementById('sederSelect').value;
    const masekhet = document.getElementById('masekhetSelect').value;
    const perek = document.getElementById('perekSelect').value;
    const mishna = document.getElementById('mishnaSelect').value;

    let filtered = allMishnayot;
    if (showOnlyFavorites) filtered = filtered.filter(m => favorites.includes(m.id));
    if (seder) filtered = filtered.filter(m => cleanString(m.seder).includes(cleanString(seder)));
    if (masekhet) filtered = filtered.filter(m => cleanString(m.masekhet).includes(cleanString(masekhet)));
    if (perek) filtered = filtered.filter(m => m.perek.toString() === perek.toString());
    if (mishna) filtered = filtered.filter(m => m.mishna.toString() === mishna.toString());
    if (query) {
        filtered = filtered.filter(i => i.georgian.toLowerCase().includes(query) || i.hebrew.includes(query) || i.transliteration.toLowerCase().includes(query));
    }

    renderMishnayot(filtered, query);
}
</script>
<script>
function renderMishnayot(list, query = '') {
    const app = document.getElementById('app');
    app.innerHTML = '';
    if (!list || list.length === 0) {
        app.innerHTML = '<div class="text-center py-12 font-bold text-slate-500">მიშნები ვერ მოიძებნა</div>';
        return;
    }
    list.forEach(item => app.appendChild(createMishnaCard(item, query)));
}

function createMishnaCard(item, query) {
    const card = document.createElement('div');
    const isFav = favorites.includes(item.id);
    const isHighlighted = !!userHighlights[item.id];
    const note = userNotes[item.id] || '';

    card.className = `mishna-card bg-white dark:bg-slate-800 rounded-2xl shadow-md p-5 border ${isHighlighted ? 'border-amber-400 ring-2 ring-amber-300 dark:ring-amber-600' : 'border-slate-200 dark:border-slate-700'} mb-6 relative`;
    card.setAttribute('data-id', item.id);

    card.innerHTML = `
        <div class="absolute top-3 right-3 flex items-center gap-1.5 z-10">
            <button onclick="speakHebrew('${item.hebrew.replace(/'/g, "\\'")}')" title="ხმოვანი წაკითხვა" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-xs">🔊</button>
            <button onclick="toggleHighlight(${item.id})" title="მარკერი" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-xs">🖍️</button>
            <button onclick="toggleFavorite(${item.id})" title="ფავორიტი" class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-700 text-xs">${isFav ? '❤️' : '🤍'}</button>
        </div>

        <div class="text-center mb-4 pr-20">
            <span class="text-[10px] font-bold text-blue-600 dark:text-blue-400 uppercase">${item.seder || ''}</span>
            <h2 class="text-xl font-extrabold">${item.masekhet || 'ტრაქტატი'}</h2>
            <p class="text-xs text-slate-500 font-semibold">თავი ${item.perek || '-'} • მიშნა ${item.mishna || '-'}</p>
        </div>

        ${item.hebrew ? `
        <div dir="rtl" class="bg-amber-50/60 dark:bg-amber-950/30 border-r-4 border-amber-500 p-3 rounded-xl mb-3">
            <p class="dynamic-text-hebrew font-serif leading-relaxed">${item.hebrew}</p>
        </div>` : ''}

        ${item.transliteration ? `
        <p class="dynamic-text-trans text-slate-500 italic mb-3 leading-relaxed">${item.transliteration}</p>` : ''}

        ${item.georgian ? `
        <div class="bg-emerald-50/60 dark:bg-emerald-950/30 border-l-4 border-emerald-500 p-3 rounded-xl mb-3">
            <p class="dynamic-text-georgian leading-relaxed">${item.georgian}</p>
        </div>` : ''}

        <!-- COMMENTARIES SECTION (KEHATI & BARTENURA) -->
        ${(item.kehati || item.bartenura) ? `
        <div class="space-y-2 my-3 border-t border-slate-100 dark:border-slate-700/60 pt-3">
            ${item.kehati ? `
            <details class="group bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700">
                <summary class="cursor-pointer p-2.5 text-xs font-bold text-slate-600 dark:text-slate-300 flex justify-between items-center select-none">
                    <span>📜 ქჰათის განმარტება</span>
                    <span class="group-open:rotate-180 transition-transform">▼</span>
                </summary>
                <div class="p-3 pt-0 dynamic-text-commentary text-slate-600 dark:text-slate-300 leading-relaxed border-t border-slate-200/50 dark:border-slate-700/50 mt-2">
                    ${item.kehati}
                </div>
            </details>` : ''}

            ${item.bartenura ? `
            <details class="group bg-slate-50 dark:bg-slate-900/50 rounded-xl border border-slate-200 dark:border-slate-700">
                <summary class="cursor-pointer p-2.5 text-xs font-bold text-slate-600 dark:text-slate-300 flex justify-between items-center select-none">
                    <span>📖 ბარტენურას კომენტარი</span>
                    <span class="group-open:rotate-180 transition-transform">▼</span>
                </summary>
                <div class="p-3 pt-0 dynamic-text-commentary text-slate-600 dark:text-slate-300 leading-relaxed border-t border-slate-200/50 dark:border-slate-700/50 mt-2">
                    ${item.bartenura}
                </div>
            </details>` : ''}
        </div>` : ''}

        <!-- PERSONAL NOTE INPUT -->
        <div class="mt-3">
            <input type="text" placeholder="📝 დაამატე პირადი შენიშვნა..." value="${note}" onchange="saveNote(${item.id}, this.value)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 text-xs focus:outline-none">
        </div>
    `;
    
    markAsRead(item.id);
    return card;
}

function toggleFavorite(id) {
    const idx = favorites.indexOf(id);
    if (idx > -1) favorites.splice(idx, 1);
    else favorites.push(id);
    localStorage.setItem('mishnaFavorites', JSON.stringify(favorites));
    applyFilters();
}

function changeFontSize(delta) {
    fontScale = Math.max(0.7, Math.min(1.8, fontScale + delta));
    document.documentElement.style.setProperty('--text-scale', fontScale);
    localStorage.setItem('mishnaFontScale', fontScale);
}

function closeModal() { document.getElementById('modal').classList.add('hidden'); }

// 1. QUIZ MODE
function openQuiz() {
    if (allMishnayot.length === 0) return;
    const randomItem = allMishnayot[Math.floor(Math.random() * allMishnayot.length)];
    
    let choices = [randomItem.masekhet];
    while(choices.length < 3 && choices.length < allMishnayot.length) {
        let rM = allMishnayot[Math.floor(Math.random() * allMishnayot.length)].masekhet;
        if(rM && !choices.includes(rM)) choices.push(rM);
    }
    choices.sort(() => Math.random() - 0.5);

    const body = document.getElementById('modalBody');
    body.innerHTML = `
        <h3 class="text-base font-bold mb-3 text-center">🎯 რომელ ტრაქტატს ეკუთვნის ეს მიშნა?</h3>
        <div dir="rtl" class="bg-amber-50 dark:bg-amber-950/40 p-3 rounded-xl text-center mb-4 font-serif text-sm">${randomItem.hebrew || randomItem.georgian}</div>
        <div class="space-y-2">
            ${choices.map(c => `<button onclick="checkQuizAnswer('${c}', '${randomItem.masekhet}')" class="w-full py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-500 hover:text-white rounded-xl text-xs font-bold transition">${c}</button>`).join('')}
        </div>
    `;
    document.getElementById('modal').classList.remove('hidden');
}

function checkQuizAnswer(selected, correct) {
    if(selected === correct) {
        alert("🎉 სწორია!");
        openQuiz();
    } else {
        alert(`❌ არასწორია. სწორია: ${correct}`);
    }
}

// 2. FLASHCARDS
let flashcardIndex = 0;
function openFlashcards() {
    if (allMishnayot.length === 0) return;
    flashcardIndex = 0;
    renderFlashcard();
    document.getElementById('modal').classList.remove('hidden');
}

function renderFlashcard() {
    const item = allMishnayot[flashcardIndex];
    const body = document.getElementById('modalBody');
    body.innerHTML = `
        <div class="text-center mb-2 text-xs font-bold text-slate-400">ბარათი ${flashcardIndex + 1} / ${allMishnayot.length}</div>
        <div id="flashCard" onclick="this.classList.toggle('flipped')" class="flip-card w-full h-48 cursor-pointer">
            <div class="flip-card-inner relative w-full h-full rounded-2xl bg-amber-50 dark:bg-slate-700 p-4 border border-amber-200 dark:border-slate-600 flex items-center justify-center text-center shadow-inner">
                <div class="flip-front absolute inset-0 p-4 flex items-center justify-center font-serif text-base" dir="rtl">${item.hebrew || 'ტექსტი არ არის'}</div>
                <div class="flip-back absolute inset-0 p-4 flex items-center justify-center text-xs font-sans leading-relaxed">${item.georgian || 'თარგმანი არ არის'}</div>
            </div>
        </div>
        <p class="text-[10px] text-center text-slate-400 mt-2">დააჭირეთ ბარათს გადმოსაბრუნებლად</p>
        <div class="flex gap-2 mt-4">
            <button onclick="nextFlashcard(-1)" class="flex-1 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl text-xs font-bold">⬅️ წინა</button>
            <button onclick="nextFlashcard(1)" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">შემდეგი ➡️</button>
        </div>
    `;
}

function nextFlashcard(dir) {
    flashcardIndex = (flashcardIndex + dir + allMishnayot.length) % allMishnayot.length;
    renderFlashcard();
}

let lastScrollY = window.scrollY;
window.addEventListener('scroll', () => {
    const header = document.getElementById('stickyHeader');
    if (window.scrollY > lastScrollY && window.scrollY > 100) {
        header.classList.add('header-hidden');
    } else {
        header.classList.remove('header-hidden');
    }
    lastScrollY = window.scrollY;
});

fetchMishnaData();
</script>
</body>
</html>
