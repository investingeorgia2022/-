    <script>
const SHEET_ID = '1fjSotzWwWe7MYtSwzB4hIOssgZFApM3_ZYOUIK9KE4Q';
const DIRECT_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const PROXY_URL = `https://corsproxy.io/?${encodeURIComponent(DIRECT_CSV_URL)}`;

const MISHNA_STRUCTURE = {

    },
    "მოყედი (מועד)": { "შაბათი (שבת)": 24, "ყერუვინი (עירובין)": 10, "ფესახიმი (פסחים)": 10, "შეკალიმი (שקלים)": 8, "იომა (יומא)": 8, "სუქა (סוכה)": 5, "ბეცა (ביצה)": 5, "როშ ჰაშანა (ראש השנה)": 4, "თაყანითი (תענית)": 4, "მეგილა (მეგילה)": 4, "მოყედ კატანი (מועד קטן)": 3, "ხაგიგა (חגיגה)": 3 },
    "ნაშიმი (נשים)": { "იევამოთი (יבמות)": 16, "ქეთუბოთი (כתובות)": 13, "ნედარიმი (נדרים)": 11, "ნაზირი (ნזיר)": 9, "სოტა (სოტა)": 9, "გიტინი (גיטין)": 9, "ქიდუშინი (קידושין)": 4 },
    "ნეზიკინი (ნזיקין)": { "ბავა კამა (בבא קמא)": 10, "ბავა მეციყა (בבא מציעא)": 10, "ბავა ბათრა (ბבא בתרא)": 10, "სანჰედრინი (סנהדრიן)": 11, "მაქოთი (מכות)": 3, "შევუოთი (שבועות)": 8, "ყედუიოთი (עדויות)": 8, "ყავოდა ზרה (עבודה זרה)": 5, "ავოთი / პირქე ავოთი (אבות)": 6, "ჰორაიოთი (הוריות)": 3 },
    "კოდაშიმი (קדשים)": { "ზებახიმი (זבחים)": 14, "მენახოთი (მנחות)": 13, "ხულინი (חולין)": 12, "ბექოროთი (בכורות)": 9, "ყარაქინი (ערכין)": 9, "თემურა (תמורה)": 7, "ქრითოთი (כריתות)": 6, "მეყილა (מעילה)": 6, "თამიდი (თამიდ)": 7, "მიდოთი (מידות)": 5, "კინემი (קינים)": 3 },
    "ტაჰაროთი (טהרות)": { "ქელიმი (כלים)": 30, "ოჰოლოტი (אהלות)": 18, "ნეგაყიმი (נגעים)": 14, "ფარა (פרה)": 12, "ტაჰაროთი (טהרות)": 10, "მიქვაოთი (מקוואות)": 10, "ნიდა (נדה)": 10, "მახშირინი (מכשירין)": 6, "ზાવીმი (זבים)": 5, "ტევულ იომი (טבול יום)": 4, "იადაყიმი (ידיים)": 4, "ყუქצინი (עוקצין)": 3 }
};
   let allMishnayot = [];
let fontScale = parseFloat(localStorage.getItem('mishnaFontScale')) || 1;
let currentAudio = null;
let isUpdatingFromScroll = false;

let favorites = JSON.parse(localStorage.getItem('mishnaFavorites')) || [];
let userNotes = JSON.parse(localStorage.getItem('mishnaNotes')) || {};
let userHighlights = JSON.parse(localStorage.getItem('mishnaHighlights')) || {};
let readHistory = JSON.parse(localStorage.getItem('mishnaReadHistory')) || [];
let themeMode = localStorage.getItem('mishnaTheme') || 'light'; 
let showOnlyFavorites = false;

function applyTheme() {
    document.documentElement.classList.remove('dark', 'oled-black');
    if (themeMode === 'dark') document.documentElement.classList.add('dark');
    if (themeMode === 'oled') document.documentElement.classList.add('dark', 'oled-black');
    localStorage.setItem('mishnaTheme', themeMode);
}
applyTheme();

function cycleTheme() {
    if (themeMode === 'light') themeMode = 'dark';
    else if (themeMode === 'dark') themeMode = 'oled';
    else themeMode = 'light';
    applyTheme();
}

function updateFontScale() {
    document.documentElement.style.setProperty('--text-scale', fontScale);
    document.getElementById('fontSizeLabel').innerText = `${Math.round(fontScale * 100)}%`;
    localStorage.setItem('mishnaFontScale', fontScale);
}

function changeFontSize(delta) {
    const newScale = fontScale + delta;
    if (newScale >= 0.7 && newScale <= 1.8) {
        fontScale = parseFloat(newScale.toFixed(1));
        updateFontScale();
    }
}

function resetFontSize() {
    fontScale = 1;
    updateFontScale();
}

function cleanString(str) {
    if (!str) return '';
    return str.toString()
        .replace(/[\u0591-\u05C7]/g, '')
        .replace(/[()\/]/g, ' ')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
}

function parseCSV(text) {
    const lines = [];
    let row = [];
    let inQuotes = false;
    let currentStr = '';

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
            if (inQuotes && nextChar === '"') { currentStr += '"'; i++; } 
            else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
            row.push(currentStr.trim());
            currentStr = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') i++;
            row.push(currentStr.trim());
            if (row.length > 1 || row[0] !== '') lines.push(row);
            row = [];
            currentStr = '';
        } else {
            currentStr += char;
        }
    }
    if (row.length > 0 || currentStr !== '') {
        row.push(currentStr.trim());
        lines.push(row);
    }
    return lines;
}

async function fetchMishnaData() {
    let csvText = '';
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const response = await fetch(PROXY_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (response.ok) csvText = await response.text();
    } catch (e) {}

    if (!csvText) {
        try {
            const response = await fetch(DIRECT_CSV_URL);
            if (response.ok) csvText = await response.text();
        } catch (e) {}
    }

    if (!csvText) {
        document.getElementById('loading').innerHTML = `
            <div class="bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 p-4 rounded-xl text-center">
                <p class="font-bold mb-1">⚠️ მონაცემები ვერ ჩაიტვირთა</p>
                <p class="text-xs">შეამოწმეთ ინტერნეტ კავშირი ან Google Sheet-ის წვდომა.</p>
                <button onclick="fetchMishnaData()" class="mt-3 bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm">↻ ხელახლა ცდა</button>
            </div>
        `;
        return;
    }

    const rows = parseCSV(csvText);
    allMishnayot = [];

    for (let i = 1; i < rows.length; i++) {
        const data = rows[i];
        if (!data || !data[0]) continue; 

        allMishnayot.push({
            id: i,
            seder: (data[1] || '').trim(),
            masekhet: (data[2] || '').trim(),
            perek: (data[3] || '').trim(),
            mishna: (data[4] || '').trim(),
            hebrew: data[5] || '',
            transliteration: data[6] || '',
            georgian: data[7] || '',
            kehati: data[8] || '',
            bartenura: data[9] || ''
        });
    }

    populateSederDropdown();
    updateProgressAndStats();
    renderMishnayot(allMishnayot);
}
    function updateProgressAndStats() {
    const totalCount = allMishnayot.length;
    const readCount = readHistory.length;
    const percent = totalCount > 0 ? Math.round((readCount / totalCount) * 100) : 0;
    
    document.getElementById('progressPercent').innerText = `${percent}%`;
    document.getElementById('progressBar').style.width = `${percent}%`;
    document.getElementById('statsSummary').innerText = `წაკითხულია: ${readCount}`;

    let streakData = JSON.parse(localStorage.getItem('mishnaStreak')) || { count: 0, lastDate: '' };
    document.getElementById('streakText').innerText = `🔥 ${streakData.count} დღიანი სერია`;
}

function markAsRead(id) {
    if (!readHistory.includes(id)) {
        readHistory.push(id);
        localStorage.setItem('mishnaReadHistory', JSON.stringify(readHistory));
        const today = new Date().toISOString().split('T')[0];
        let streakData = JSON.parse(localStorage.getItem('mishnaStreak')) || { count: 0, lastDate: '' };
        if (streakData.lastDate !== today) {
            streakData.count += 1;
            streakData.lastDate = today;
            localStorage.setItem('mishnaStreak', JSON.stringify(streakData));
        }
        updateProgressAndStats();
    }
}

function populateSederDropdown() {
    const sederSelect = document.getElementById('sederSelect');
    sederSelect.innerHTML = '<option value="">ყველა სედერი</option>';
    Object.keys(MISHNA_STRUCTURE).forEach(seder => {
        sederSelect.innerHTML += `<option value="${seder}">${seder}</option>`;
    });
}

function onSederChange() {

    const selectedSeder = document.getElementById('sederSelect').value;
    const masekhetSelect = document.getElementById('masekhetSelect');
    const perekSelect = document.getElementById('perekSelect');
    const mishnaSelect = document.getElementById('mishnaSelect');

    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
    perekSelect.disabled = true;

    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    mishnaSelect.disabled = true;

    if (!selectedSeder || !MISHNA_STRUCTURE[selectedSeder]) {
        masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
        masekhetSelect.disabled = true;
        applyFilters();
        return;
    }

    const masekhtot = Object.keys(MISHNA_STRUCTURE[selectedSeder]);
    masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
    masekhtot.forEach(m => {
        masekhetSelect.innerHTML += `<option value="${m}">${m}</option>`;
    });
    masekhetSelect.disabled = false;
    applyFilters();
}

function onMasekhetChange() {
    if (isUpdatingFromScroll) return;
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const perekSelect = document.getElementById('perekSelect');
    const mishnaSelect = document.getElementById('mishnaSelect');

    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    mishnaSelect.disabled = true;

    if (!selectedMasekhet || !MISHNA_STRUCTURE[selectedSeder] || !MISHNA_STRUCTURE[selectedSeder][selectedMasekhet]) {
        perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
        perekSelect.disabled = true;
        applyFilters();
        return;
    }

    const masekhetData = MISHNA_STRUCTURE[selectedSeder][selectedMasekhet];
    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';

    let totalPerakim = typeof masekhetData === 'object' ? Object.keys(masekhetData).length : masekhetData;

    for (let i = 1; i <= totalPerakim; i++) {
        perekSelect.innerHTML += `<option value="${i}">თავი ${i}</option>`;
    }
    perekSelect.disabled = false;
    applyFilters();

    const mishnaSelect = document.getElementById('mishnaSelect');

    if (!selectedPerek) {
        mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
        mishnaSelect.disabled = true;
        applyFilters();
        return;
    }

    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';

    let availableMishnayot = allMishnayot.filter(m => 
        cleanString(m.seder).includes(cleanString(selectedSeder)) &&
        cleanString(m.masekhet).includes(cleanString(selectedMasekhet)) &&
        m.perek.toString() === selectedPerek.toString()
    ).map(m => parseInt(m.mishna)).sort((a,b) => a - b);

    let maxMishna = 10;
    const masekhetData = MISHNA_STRUCTURE[selectedSeder]?.[selectedMasekhet];
    if (typeof masekhetData === 'object' && masekhetData[selectedPerek]) {
        maxMishna = masekhetData[selectedPerek];
    }

    let mishnaCount = Math.max(maxMishna, availableMishnayot.length > 0 ? Math.max(...availableMishnayot) : 0);

    for (let i = 1; i <= mishnaCount; i++) {
        mishnaSelect.innerHTML += `<option value="${i}">მიშნა ${i}</option>`;
    }

    mishnaSelect.disabled = false;
    applyFilters();
}

function onMishnaChange() {
    if (!isUpdatingFromScroll) applyFilters();
}

function toggleFavoritesFilter() {
    showOnlyFavorites = !showOnlyFavorites;
    const favBtn = document.getElementById('favFilterBtn');
    favBtn.classList.toggle('bg-rose-500', showOnlyFavorites);
    favBtn.classList.toggle('text-white', showOnlyFavorites);
    applyFilters();
}

function applyFilters() {
    stopSpeech();
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const selectedPerek = document.getElementById('perekSelect').value;
    const selectedMishna = document.getElementById('mishnaSelect').value;

    let filtered = allMishnayot;

    if (showOnlyFavorites) {
        filtered = filtered.filter(m => favorites.includes(m.id));
    }
    if (selectedSeder) {
        const cleanSelectedSeder = cleanString(selectedSeder);
        filtered = filtered.filter(m => cleanString(m.seder).includes(cleanSelectedSeder) || cleanSelectedSeder.includes(cleanString(m.seder)));
    }
    if (selectedMasekhet) {
        const cleanSelectedMasekhet = cleanString(selectedMasekhet);
        filtered = filtered.filter(m => cleanString(m.masekhet).includes(cleanSelectedMasekhet) || cleanSelectedMasekhet.includes(cleanString(m.masekhet)));
    }
    if (selectedPerek) {
        filtered = filtered.filter(m => m.perek.toString() === selectedPerek.toString());
    }
    if (selectedMishna) {
        filtered = filtered.filter(m => m.mishna.toString() === selectedMishna.toString());
    }

    if (query) {
        filtered = filtered.filter(item => 
            item.georgian.toLowerCase().includes(query) ||
            item.hebrew.includes(query) ||
            item.transliteration.toLowerCase().includes(query) ||
            item.kehati.toLowerCase().includes(query) ||
            item.bartenura.toLowerCase().includes(query)
        );
    }

    renderMishnayot(filtered);
}

function handleSearch() { applyFilters(); }

function resetFilters() {
    stopSpeech();
    document.getElementById('searchInput').value = '';
    document.getElementById('sederSelect').value = '';
    
    const masekhetSelect = document.getElementById('masekhetSelect');
    masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
    masekhetSelect.disabled = true;

    const perekSelect = document.getElementById('perekSelect');
    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
    perekSelect.disabled = true;

    const mishnaSelect = document.getElementById('mishnaSelect');
    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    mishnaSelect.disabled = true;

    renderMishnayot(allMishnayot);
}

function renderMishnayot(list, isDaily = false) {
    const app = document.getElementById('app');
    app.innerHTML = ''; 

    if (list.length === 0) {
        app.innerHTML = `
            <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6">
                <p class="text-3xl mb-2">📚</p>
                <p class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">ტექსტი ჯერ არ არის დამატებული</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">ამ არჩეული მიშნის თარგმანი მალე დაემატება ბაზაში.</p>
            </div>
        `;
        document.getElementById('currentMishnaText').innerText = "შედეგი არ მოიძებნა";

    list.forEach(item => { app.appendChild(createMishnaCard(item, isDaily)); });
    updateActiveMishnaOnScroll();
}

let isScrolling = false;
let lastActiveCard = null;

function updateActiveMishnaOnScroll() {
    const cards = document.querySelectorAll('.mishna-card');
    if (cards.length === 0) return;

    let currentCard = cards[0];
    const triggerBottom = window.innerHeight / 3;

    for (let card of cards) {
        const box = card.getBoundingClientRect();
        if (box.top <= triggerBottom) {
            currentCard = card;
        } else {
            break;
        }
    }

    if (currentCard !== lastActiveCard) {
        lastActiveCard = currentCard;
        
        const seder = currentCard.getAttribute('data-seder');
        const masekhet = currentCard.getAttribute('data-masekhet');
        const perek = currentCard.getAttribute('data-perek');
        const mishna = currentCard.getAttribute('data-mishna');

        document.getElementById('currentMishnaText').innerText = `${seder} • ტრაქტატი ${masekhet} • თავი ${perek} • მიშნა ${mishna}`;

        isUpdatingFromScroll = true;
        updateDropdownsSilently(seder, masekhet, perek, mishna);
        isUpdatingFromScroll = false;
    }
}

function updateDropdownsSilently(seder, masekhet, perek, mishna) {
    const sederSelect = document.getElementById('sederSelect');
    const masekhetSelect = document.getElementById('masekhetSelect');
    const perekSelect = document.getElementById('perekSelect');
    const mishnaSelect = document.getElementById('mishnaSelect');

    if (sederSelect.value !== seder) {
        sederSelect.value = seder;
    }

    if (seder && MISHNA_STRUCTURE[seder]) {
        const masekhtot = Object.keys(MISHNA_STRUCTURE[seder]);
        masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
        masekhtot.forEach(m => {
            masekhetSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });
        masekhetSelect.disabled = false;
        masekhetSelect.value = masekhet;
    }

    if (seder && masekhet && MISHNA_STRUCTURE[seder]?.[masekhet]) {
        const masekhetData = MISHNA_STRUCTURE[seder][masekhet];
        let totalPerakim = typeof masekhetData === 'object' ? Object.keys(masekhetData).length : masekhetData;
        
        perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
        for (let i = 1; i <= totalPerakim; i++) {
            perekSelect.innerHTML += `<option value="${i}">თავი ${i}</option>`;
        }
        perekSelect.disabled = false;
        perekSelect.value = perek;
    }

    if (perek) {
        let maxMishna = 10;
        const masekhetData = MISHNA_STRUCTURE[seder]?.[masekhet];
        if (typeof masekhetData === 'object' && masekhetData[perek]) {
            maxMishna = masekhetData[perek];
        }
        
        mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
        for (let i = 1; i <= maxMishna; i++) {
            mishnaSelect.innerHTML += `<option value="${i}">მიშნა ${i}</option>`;
        }
        mishnaSelect.disabled = false;
        mishnaSelect.value = mishna;
    }
}

let lastScrollY = window.scrollY;
let lastScrollTime = Date.now();

window.addEventListener('scroll', () => {
    const currentScrollY = window.scrollY;
    const currentTime = Date.now();
    
    const header = document.getElementById('stickyHeader');
    const diffY = currentScrollY - lastScrollY;
    const diffTime = currentTime - lastScrollTime;

    const speed = diffTime > 0 ? (diffY / diffTime) : 0;

    if (currentScrollY <= 20) {
        header.classList.remove('header-hidden');
    } 
    else if (diffY > 8) {
        header.classList.add('header-hidden');
    } 
    else if (diffY < -50 || speed < -1.8) {
        header.classList.remove('header-hidden');
    }

    lastScrollY = currentScrollY;
    lastScrollTime = currentTime;

    if (!isScrolling) {
        window.requestAnimationFrame(() => {
            updateActiveMishnaOnScroll();
            isScrolling = false;
        });
        isScrolling = true;
    }
});

function switchTab(id, tab) {
    const bartenuraContent = document.getElementById(`content-bartenura-${id}`);
    const kehatiContent = document.getElementById(`content-kehati-${id}`);
    const bartenuraTab = document.getElementById(`tab-bartenura-${id}`);
    const kehatiTab = document.getElementById(`tab-kehati-${id}`);

    if (tab === 'bartenura') {
        bartenuraContent.classList.remove('hidden');
        kehatiContent.classList.add('hidden');
        bartenuraTab.className = "flex-1 py-3 text-xs font-bold text-purple-600 dark:text-purple-400 border-b-2 border-purple-500 bg-white dark:bg-slate-800";
        kehatiTab.className = "flex-1 py-3 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-orange-600";
    } else {
        kehatiContent.classList.remove('hidden');
        bartenuraContent.classList.add('hidden');
        kehatiTab.className = "flex-1 py-3 text-xs font-bold text-orange-600 dark:text-orange-400 border-b-2 border-orange-500 bg-white dark:bg-slate-800";
        bartenuraTab.className = "flex-1 py-3 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-purple-600";
    }
}

function escapeQuotes(str) {
    if (!str) return '';
    return str
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/\r?\n|\r/g, ' ');
}

function speakText(text, lang) {
    stopSpeech();
    if (!text) return;

    if (lang === 'he') {
        const cleanText = text.replace(/[\u0591-\u05C7]/g, "");
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=iw&client=tw-ob`;
        currentAudio = new Audio(url);
        currentAudio.play().catch(() => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'he-IL';
                window.speechSynthesis.speak(utterance);
            }
        });
    } else {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ka-GE';
            utterance.rate = 0.9;
            
            const voices = window.speechSynthesis.getVoices();
            const kaVoice = voices.find(v => v.lang.includes('ka') || v.lang.includes('GE'));
            if (kaVoice) utterance.voice = kaVoice;

            window.speechSynthesis.speak(utterance);
        }
    }
}

function stopSpeech() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

function showDailyMishna() {
    if (allMishnayot.length === 0) return;
    const randomIndex = Math.floor(Math.random() * allMishnayot.length);
    renderMishnayot([allMishnayot[randomIndex]], true);
}

function toggleFavorite(id) {
    const idx = favorites.indexOf(id);
    if (idx > -1) favorites.splice(idx, 1);
    else favorites.push(id);
    localStorage.setItem('mishnaFavorites', JSON.stringify(favorites));
    applyFilters();
}

function saveNote(id, text) {
    userNotes[id] = text;
    localStorage.setItem('mishnaNotes', JSON.stringify(userNotes));
}

function toggleHighlight(id) {
    userHighlights[id] = !userHighlights[id];
    localStorage.setItem('mishnaHighlights', JSON.stringify(userHighlights));
    applyFilters();
}

function closeModal() { 
    document.getElementById('modal').classList.add('hidden'); 
}

function openQuiz() {
    if (allMishnayot.length === 0) return;
    const randomItem = allMishnayot[Math.floor(Math.random() * allMishnayot.length)];
    let choices = [randomItem.masekhet];
    while(choices.length < 3 && choices.length < allMishnayot.length) {
        let rM = allMishnayot[Math.floor(Math.random() * allMishnayot.length)].masekhet;
        if(rM && !choices.includes(rM)) choices.push(rM);
    }
    choices.sort(() => Math.random() - 0.5);
    document.getElementById('modalBody').innerHTML = `
        <h3 class="text-base font-bold mb-3 text-center text-slate-800 dark:text-slate-100">🎯 რომელ ტრაქტატს ეკუთვნის ეს მიშნა?</h3>
        <div dir="rtl" class="bg-amber-50 dark:bg-amber-950/40 p-3 rounded-xl text-center mb-4 font-serif text-sm text-slate-900 dark:text-slate-100">${randomItem.hebrew || randomItem.georgian}</div>
        <div class="space-y-2">
            ${choices.map(c => `<button onclick="checkQuizAnswer('${c}', '${randomItem.masekhet}')" class="w-full py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-blue-500 hover:text-white rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 transition">${c}</button>`).join('')}
        </div>
    `;
    document.getElementById('modal').classList.remove('hidden');
}

function checkQuizAnswer(selected, correct) {
    if(selected === correct) { alert("🎉 სწორია!"); openQuiz(); } 
    else { alert(`❌ არასწორია. სწორია: ${correct}`); }
}

let flashcardIndex = 0;
function openFlashcards() {
    if (allMishnayot.length === 0) return;
    flashcardIndex = 0;
    renderFlashcard();
    document.getElementById('modal').classList.remove('hidden');
}

function renderFlashcard() {
    const item = allMishnayot[flashcardIndex];
    document.getElementById('modalBody').innerHTML = `
        <div class="text-center mb-2 text-xs font-bold text-slate-400">ბარათი ${flashcardIndex + 1} / ${allMishnayot.length}</div>
        <div id="flashCard" onclick="this.classList.toggle('flipped')" class="flip-card w-full h-48 cursor-pointer">
            <div class="flip-card-inner relative w-full h-full rounded-2xl bg-amber-50 dark:bg-slate-700 p-4 border border-amber-200 dark:border-slate-600 flex items-center justify-center text-center shadow-inner">
                <div class="flip-front absolute inset-0 p-4 flex items-center justify-center font-serif text-base text-slate-900 dark:text-slate-100" dir="rtl">${item.hebrew || 'ტექსტი არ არის'}</div>
                <div class="flip-back absolute inset-0 p-4 flex items-center justify-center text-xs font-sans leading-relaxed text-slate-800 dark:text-slate-200">${item.georgian || 'თარგმანი არ არის'}</div>
            </div>
        </div>
        <p class="text-[10px] text-center text-slate-400 mt-2">დააჭირეთ ბარათს გადმოსაბრუნებლად</p>
        <div class="flex gap-2 mt-4">
            <button onclick="nextFlashcard(-1)" class="flex-1 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200">⬅️ წინა</button>
            <button onclick="nextFlashcard(1)" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold">შემდეგი ➡️</button>
        </div>
    `;
}

function nextFlashcard(dir) {
    flashcardIndex = (flashcardIndex + dir + allMishnayot.length) % allMishnayot.length;
    renderFlashcard();
}

updateFontScale();
fetchMishnaData();
