    <script>
const SHEET_ID = '1fjSotzWwWe7MYtSwzB4hIOssgZFApM3_ZYOUIK9KE4Q';
const DIRECT_CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
const PROXY_URL = `https://corsproxy.io/?${encodeURIComponent(DIRECT_CSV_URL)}`;

const MISHNA_STRUCTURE = {
    "ზერაყიმი (זרעים)": { 
        "ბერახოთი (ברכות)": { 1: 5, 2: 8, 3: 6, 4: 7, 5: 5, 6: 8, 7: 5, 8: 8, 9: 5 },
        "ფეა (פאה)": 8, "დმაი (דמאי)": 7, "ქილაყიმი (כלאים)": 9, "შევიყითი (שביעית)": 10, "თრუმოთი (תרומות)": 11, "მაყასროთი (מעשרות)": 5, "მაყასერ შენი (מעשר שני)": 5, "ხალა (חלה)": 4, "ყორლა (ערלה)": 3, "ბიქურიმი (ביכורים)": 4 
    },
    "მოყედი (מועד)": { "შაბათი (שבת)": 24, "ყერუვინი (עירובין)": 10, "ფესახიმი (פסחים)": 10, "შეკალიმი (שקלים)": 8, "იომა (יומא)": 8, "სუქა (סוכה)": 5, "ბეცა (ביצה)": 5, "როშ ჰაშანა (ראש השנה)": 4, "თაყანითი (תענית)": 4, "მეგილა (מגילה)": 4, "მოყედ კატანი (מועד קטן)": 3, "ხაგიგა (חגיגה)": 3 },
    "ნაშიმი (נשים)": { "იევამოთი (יבמות)": 16, "ქეთუბოთი (כתובות)": 13, "ნედარიმი (נדרים)": 11, "ნაზირი (ნזיר)": 9, "სოტა (სოტა)": 9, "გიტინი (גיטין)": 9, "ქიდუშინი (קידושין)": 4 },
    "ნეზიკინი (נזיקין)": { "ბავა კამა (בבא קמא)": 10, "ბავა მეციყა (בבא מציעא)": 10, "ბავა ბათრა (ბבא בתרא)": 10, "სანჰედრინი (סנהדרין)": 11, "მაქოთი (מכות)": 3, "შევუოთი (שבועות)": 8, "ყედუიოთი (עדויות)": 8, "ყავოდა ზარა (עבודה זרה)": 5, "ავოთი / პირქე ავოთი (אבות)": 6, "ჰორაიოთი (הוריות)": 3 },
    "კოდაშიმი (קדשים)": { "ზებახიმი (זבחים)": 14, "მენახოთი (מנחות)": 13, "ხულინი (חולין)": 12, "ბექოროთი (בכורות)": 9, "ყარაქინი (ערכין)": 9, "თემურა (תמורה)": 7, "ქრითოთი (כריתות)": 6, "მეყილა (מעילה)": 6, "თამიდი (თამიდ)": 7, "მიდოთი (მიდოთი)": 5, "კინემი (קינים)": 3 },
    "ტაჰაროთი (טהרות)": { "ქელიმი (כלים)": 30, "ოჰოლოტი (אהלות)": 18, "ნეგაყიმი (נגעים)": 14, "ფარა (פרה)": 12, "ტაჰაროთი (טהרות)": 10, "მიქვაოთი (מקוואות)": 10, "ნიდა (נדה)": 10, "მახშირინი (מכשירין)": 6, "ზાવીმი (זבים)": 5, "ტევულ იომი (טבול יום)": 4, "იადაყიმი (ידיים)": 4, "ყუქცინი (עוקצין)": 3 }
};

let allMishnayot = [];
let fontScale = parseFloat(localStorage.getItem('mishnaFontScale')) || 1;
let currentAudio = null;
let isUpdatingFromScroll = false;
let favorites = JSON.parse(localStorage.getItem('mishnaFavorites')) || [];
let showOnlyFavorites = false;
let darkMode = localStorage.getItem('mishnaDarkMode') === 'true';

if (darkMode) {
    document.documentElement.classList.add('dark');
}

function toggleDarkMode() {
    darkMode = !darkMode;
    localStorage.setItem('mishnaDarkMode', darkMode);
    if (darkMode) {
        document.documentElement.classList.add('dark');
    } else {
        document.documentElement.classList.remove('dark');
    }
}

function updateFontScale() {
    document.documentElement.style.setProperty('--text-scale', fontScale);
    document.getElementById('fontSizeLabel').innerText = `${Math.round(fontScale * 100)}%`;
    localStorage.setItem('mishnaFontScale', fontScale);
}

function changeFontSize(delta) {
    const newScale = fontScale + delta;
    if (newScale >= 0.7 && newScale <= 1.8) {
        fontScale = parseFloat(newScale.toFixed(1));
        updateFontScale();
    }
}

function resetFontSize() {
    fontScale = 1;
    updateFontScale();
}

function cleanString(str) {
    if (!str) return '';
    return str.toString()
        .replace(/[\u0591-\u05C7]/g, '')
        .toLowerCase()
        .trim();
}

function highlightText(text, query) {
    if (!query || !text) return text;
    try {
        const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        const regex = new RegExp(`(${escapedQuery})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
    } catch (e) {
        return text;
    }
}

function parseCSV(text) {
    const lines = [];
    let row = [];
    let inQuotes = false;
    let currentStr = '';

    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
            if (inQuotes && nextChar === '"') { currentStr += '"'; i++; } 
            else { inQuotes = !inQuotes; }
        } else if (char === ',' && !inQuotes) {
            row.push(currentStr.trim());
            currentStr = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
            if (char === '\r' && nextChar === '\n') i++;
            row.push(currentStr.trim());
            if (row.length > 1 || row[0] !== '') lines.push(row);
            row = [];
            currentStr = '';
        } else {
            currentStr += char;
        }
    }
    if (row.length > 0 || currentStr !== '') {
        row.push(currentStr.trim());
        lines.push(row);
    }
    return lines;
}

async function fetchMishnaData() {
    let csvText = '';
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const response = await fetch(PROXY_URL, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (response.ok) csvText = await response.text();
    } catch (e) {}

    if (!csvText) {
        try {
            const response = await fetch(DIRECT_CSV_URL);
            if (response.ok) csvText = await response.text();
        } catch (e) {}
    }

    if (!csvText) {
        document.getElementById('loading').innerHTML = `
            <div class="bg-red-50 dark:bg-red-950/50 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-300 p-4 rounded-xl text-center">
                <p class="font-bold mb-1">⚠️ მონაცემები ვერ ჩაიტვირთა</p>
                <p class="text-xs">შეამოწმეთ ინტერნეტ კავშირი ან Google Sheet-ის წვდომა.</p>
                <button onclick="fetchMishnaData()" class="mt-3 bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm">↻ ხელახლა ცდა</button>
            </div>
        `;
        return;
    }

    const rows = parseCSV(csvText);
    allMishnayot = [];

    for (let i = 1; i < rows.length; i++) {
        const data = rows[i];
        if (!data || !data[0]) continue; 

        allMishnayot.push({
            id: i,
            seder: (data[1] || '').trim(),
            masekhet: (data[2] || '').trim(),
            perek: (data[3] || '').trim(),
            mishna: (data[4] || '').trim(),
            hebrew: data[5] || '',
            transliteration: data[6] || '',
            georgian: data[7] || '',
            kehati: data[8] || '',
            bartenura: data[9] || ''
        });
    }

    populateSederDropdown();
    checkLastRead();
    applyFilters();
}
    </script>
  <script>
function checkLastRead() {
    const lastRead = JSON.parse(localStorage.getItem('mishnaLastRead'));
    if (lastRead) {
        const banner = document.getElementById('lastReadBanner');
        const textEl = document.getElementById('lastReadText');
        textEl.innerText = `📖 ბოლო წაკითხული: ${lastRead.seder} • ${lastRead.masekhet} (თავი ${lastRead.perek}, მიშნა ${lastRead.mishna})`;
        banner.classList.remove('hidden');
    }
}

function resumeLastRead() {
    const lastRead = JSON.parse(localStorage.getItem('mishnaLastRead'));
    if (!lastRead) return;

    document.getElementById('sederSelect').value = lastRead.seder;
    onSederChange();
    document.getElementById('masekhetSelect').value = lastRead.masekhet;
    onMasekhetChange();
    document.getElementById('perekSelect').value = lastRead.perek;
    onPerekChange();
    document.getElementById('mishnaSelect').value = lastRead.mishna;
    applyFilters();
}

function populateSederDropdown() {
    const sederSelect = document.getElementById('sederSelect');
    sederSelect.innerHTML = '<option value="">ყველა სედერი</option>';
    Object.keys(MISHNA_STRUCTURE).forEach(seder => {
        sederSelect.innerHTML += `<option value="${seder}">${seder}</option>`;
    });
}

function onSederChange() {
    if (isUpdatingFromScroll) return;
    const selectedSeder = document.getElementById('sederSelect').value;
    const masekhetSelect = document.getElementById('masekhetSelect');
    const perekSelect = document.getElementById('perekSelect');
    const mishnaSelect = document.getElementById('mishnaSelect');

    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
    perekSelect.disabled = true;

    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    mishnaSelect.disabled = true;

    if (!selectedSeder || !MISHNA_STRUCTURE[selectedSeder]) {
        masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
        masekhetSelect.disabled = true;
        applyFilters();
        return;
    }

    const masekhtot = Object.keys(MISHNA_STRUCTURE[selectedSeder]);
    masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
    masekhtot.forEach(m => {
        masekhetSelect.innerHTML += `<option value="${m}">${m}</option>`;
    });
    masekhetSelect.disabled = false;
    applyFilters();
}

function onMasekhetChange() {
    if (isUpdatingFromScroll) return;
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const perekSelect = document.getElementById('perekSelect');
    const mishnaSelect = document.getElementById('mishnaSelect');

    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    mishnaSelect.disabled = true;

    if (!selectedMasekhet || !MISHNA_STRUCTURE[selectedSeder] || !MISHNA_STRUCTURE[selectedSeder][selectedMasekhet]) {
        perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
        perekSelect.disabled = true;
        applyFilters();
        return;
    }

    const masekhetData = MISHNA_STRUCTURE[selectedSeder][selectedMasekhet];
    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';

    let totalPerakim = typeof masekhetData === 'object' ? Object.keys(masekhetData).length : masekhetData;

    for (let i = 1; i <= totalPerakim; i++) {
        perekSelect.innerHTML += `<option value="${i}">თავი ${i}</option>`;
    }
    perekSelect.disabled = false;
    applyFilters();
}

function onPerekChange() {
    if (isUpdatingFromScroll) return;
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const selectedPerek = document.getElementById('perekSelect').value;
    const mishnaSelect = document.getElementById('mishnaSelect');

    if (!selectedPerek) {
        mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
        mishnaSelect.disabled = true;
        applyFilters();
        return;
    }

    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';

    let availableMishnayot = allMishnayot.filter(m => 
        cleanString(m.seder).includes(cleanString(selectedSeder)) &&
        cleanString(m.masekhet).includes(cleanString(selectedMasekhet)) &&
        m.perek.toString() === selectedPerek.toString()
    ).map(m => parseInt(m.mishna)).sort((a,b) => a - b);

    let maxMishna = 10;
    const masekhetData = MISHNA_STRUCTURE[selectedSeder]?.[selectedMasekhet];
    if (typeof masekhetData === 'object' && masekhetData[selectedPerek]) {
        maxMishna = masekhetData[selectedPerek];
    }

    let mishnaCount = Math.max(maxMishna, availableMishnayot.length > 0 ? Math.max(...availableMishnayot) : 0);

    for (let i = 1; i <= mishnaCount; i++) {
        mishnaSelect.innerHTML += `<option value="${i}">მიშნა ${i}</option>`;
    }

    mishnaSelect.disabled = false;
    applyFilters();
}

function onMishnaChange() {
    if (!isUpdatingFromScroll) applyFilters();
}

function toggleFavoritesFilter() {
    showOnlyFavorites = !showOnlyFavorites;
    const btn = document.getElementById('favFilterBtn');
    if (showOnlyFavorites) {
        btn.classList.add('bg-rose-500', 'text-white');
        btn.classList.remove('bg-slate-100', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-200');
    } else {
        btn.classList.remove('bg-rose-500', 'text-white');
        btn.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-200');
    }
    applyFilters();
}

function toggleFavorite(id) {
    const index = favorites.indexOf(id);
    if (index > -1) {
        favorites.splice(index, 1);
    } else {
        favorites.push(id);
    }
    localStorage.setItem('mishnaFavorites', JSON.stringify(favorites));
    applyFilters();
}

function applyFilters() {
    stopSpeech();
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const selectedSeder = document.getElementById('sederSelect').value;
    const selectedMasekhet = document.getElementById('masekhetSelect').value;
    const selectedPerek = document.getElementById('perekSelect').value;
    const selectedMishna = document.getElementById('mishnaSelect').value;

    let filtered = allMishnayot;

    if (showOnlyFavorites) {
        filtered = filtered.filter(m => favorites.includes(m.id));
    }

    if (selectedSeder) {
        const cleanSelectedSeder = cleanString(selectedSeder);
        filtered = filtered.filter(m => cleanString(m.seder).includes(cleanSelectedSeder) || cleanSelectedSeder.includes(cleanString(m.seder)));
    }
    if (selectedMasekhet) {
        const cleanSelectedMasekhet = cleanString(selectedMasekhet);
        filtered = filtered.filter(m => cleanString(m.masekhet).includes(cleanSelectedMasekhet) || cleanSelectedMasekhet.includes(cleanString(m.masekhet)));
    }
    if (selectedPerek) {
        filtered = filtered.filter(m => m.perek.toString() === selectedPerek.toString());
    }
    if (selectedMishna) {
        filtered = filtered.filter(m => m.mishna.toString() === selectedMishna.toString());
    }

    if (query) {
        filtered = filtered.filter(item => 
            item.georgian.toLowerCase().includes(query) ||
            item.hebrew.includes(query) ||
            item.transliteration.toLowerCase().includes(query) ||
            item.kehati.toLowerCase().includes(query) ||
            item.bartenura.toLowerCase().includes(query)
        );
    }

    updateProgress(selectedSeder, selectedMasekhet, filtered);
    renderMishnayot(filtered, false, query);
}

function updateProgress(selectedSeder, selectedMasekhet, filteredList) {
    const titleEl = document.getElementById('progressTitle');
    const percentEl = document.getElementById('progressPercent');
    const barEl = document.getElementById('progressBar');

    if (!selectedMasekhet) {
        titleEl.innerText = "აირჩიეთ ტრაქტატი პროგრესისთვის";
        percentEl.innerText = "";
        barEl.style.width = "0%";
        return;
    }

    let totalInMasekhet = 0;
    const sederData = MISHNA_STRUCTURE[selectedSeder];
    if (sederData && sederData[selectedMasekhet]) {
        const mData = sederData[selectedMasekhet];
        if (typeof mData === 'object') {
            Object.values(mData).forEach(count => totalInMasekhet += count);
        } else {
            totalInMasekhet = mData * 10;
        }
    }

    let viewedCount = filteredList.length;
    let percent = totalInMasekhet > 0 ? Math.min(Math.round((viewedCount / totalInMasekhet) * 100), 100) : 0;

    titleEl.innerText = `პროგრესი: ${selectedMasekhet}`;
    percentEl.innerText = `${percent}%`;
    barEl.style.width = `${percent}%`;
}

function handleSearch() { applyFilters(); }

function resetFilters() {
    stopSpeech();
    showOnlyFavorites = false;
    const btn = document.getElementById('favFilterBtn');
    btn.classList.remove('bg-rose-500', 'text-white');
    btn.classList.add('bg-slate-100', 'dark:bg-slate-700', 'text-slate-700', 'dark:text-slate-200');

    document.getElementById('searchInput').value = '';
    document.getElementById('sederSelect').value = '';
    
    const masekhetSelect = document.getElementById('masekhetSelect');
    masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
    masekhetSelect.disabled = true;

    const perekSelect = document.getElementById('perekSelect');
    perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
    perekSelect.disabled = true;

    const mishnaSelect = document.getElementById('mishnaSelect');
    mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
    mishnaSelect.disabled = true;

    renderMishnayot(allMishnayot);
}

   <script>
function renderMishnayot(list, isDaily = false, query = '') {
    const app = document.getElementById('app');
    app.innerHTML = ''; 

    if (list.length === 0) {
        app.innerHTML = `
            <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-6">
                <p class="text-3xl mb-2">📚</p>
                <p class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-1">ტექსტი ვერ მოიძებნა</p>
                <p class="text-xs text-slate-500 dark:text-slate-400">შეცვალეთ ფილტრები ან საძიებო სიტყვა.</p>
            </div>
        `;
        document.getElementById('currentMishnaText').innerText = "შედეგი არ მოიძებნა";
        return;

    list.forEach(item => { app.appendChild(createMishnaCard(item, isDaily, query)); });
    updateActiveMishnaOnScroll();
}

function createMishnaCard(item, isDaily, query = '') {

        <div class="absolute top-3 right-3 flex items-center gap-1.5">
            ${isDaily ? `<span class="bg-amber-500 text-white text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full shadow-sm">დღის მიშნა</span>` : ''}
            <button onclick="toggleFavorite(${item.id})" title="ფავორიტებში დამატება" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center text-sm transition">
                ${isFav ? '❤️' : '🤍'}

            <button onclick="copyMishna(${item.id})" title="კოპირება" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center text-xs transition">
                📋
            </button>
        </div>

        <div class="text-center mb-6 pr-16 sm:pr-0">
            <span class="text-xs font-bold text-blue-600 dark:text-blue-400 uppercase tracking-widest">${item.seder}</span>
            <h1 class="text-2xl font-extrabold text-slate-800 dark:text-slate-100 mt-1">ტრაქტატი ${item.masekhet}</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold mt-1">თავი ${item.perek} • მიშნა ${item.mishna}</p>
        </div>

        <div dir="rtl" class="bg-amber-50/60 dark:bg-amber-950/30 border-r-4 border-amber-500 p-4 rounded-xl mb-3 relative">
            <div class="flex justify-between items-center mb-1">

                    <span>🔊</span> <span>მოსმენა</span>

        <div class="bg-slate-50 dark:bg-slate-900/50 border-l-4 border-slate-400 dark:border-slate-600 p-3 rounded-xl mb-3">
            <span class="text-[10px] font-bold text-slate-500 dark:text-slate-400 block mb-1">ტრანსლიტერაცია</span>
            <p class="dynamic-text-trans italic text-slate-700 dark:text-slate-300 leading-relaxed">${highlightText(item.transliteration, query)}</p>
        </div>
        ` : ''}

        <div class="bg-emerald-50/60 dark:bg-emerald-950/30 border-l-4 border-emerald-500 p-4 rounded-xl mb-6 relative">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] font-bold text-emerald-700 dark:text-emerald-400">ქართული თარგმანი</span>
                <button onclick="speakText('${escapeQuotes(item.georgian)}', 'ka')" class="text-xs bg-emerald-200/60 dark:bg-emerald-900/60 hover:bg-emerald-300/80 text-emerald-900 dark:text-emerald-200 font-bold px-2 py-1 rounded-lg transition flex items-center gap-1">
                    <span>🔊</span> <span>მოსმენა</span>
                </button>
            </div>
            <p class="dynamic-text-georgian text-slate-800 dark:text-slate-200 leading-relaxed">${highlightText(item.georgian, query)}</p>
        </div>

        <div class="border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
            <div class="flex border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900">
                <button onclick="switchTab(${item.id}, 'bartenura')" id="tab-bartenura-${item.id}" class="flex-1 py-3 text-xs font-bold text-purple-600 dark:text-purple-400 border-b-2 border-purple-500 bg-white dark:bg-slate-800">
                    📜 ბარტანურა
                </button>
                <button onclick="switchTab(${item.id}, 'kehati')" id="tab-kehati-${item.id}" class="flex-1 py-3 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-orange-600">
                    📖 კეჰათი
                </button>
            </div>

            <div class="p-4 bg-white dark:bg-slate-800 text-xs leading-relaxed text-slate-600 dark:text-slate-300">
                <div id="content-bartenura-${item.id}">
                    <div class="flex justify-between items-center mb-2">
                        <strong class="text-purple-600 dark:text-purple-400">რაბი ყოვადია ბარტანურას განმარტება:</strong>
                        ${item.bartenura ? `<button onclick="speakText('${escapeQuotes(item.bartenura)}', 'ka')" class="text-[11px] bg-purple-100 dark:bg-purple-950/60 hover:bg-purple-200 text-purple-800 dark:text-purple-300 font-bold px-2 py-0.5 rounded transition">🔊 მოსმენა</button>` : ''}
                    </div>
                    <p class="dynamic-text-commentary">${highlightText(item.bartenura || 'განმარტება არ არის.', query)}</p>
                </div>

                    <div class="flex justify-between items-center mb-2">
                        <strong class="text-orange-600 dark:text-orange-400">რაბინ პინხას კეჰათის განმარტება:</strong>

}

function copyMishna(id) {
    const item = allMishnayot.find(m => m.id === id);
    if (!item) return;

    const textToCopy = `ტრაქტატი ${item.masekhet} (თავი ${item.perek}, მიშნა ${item.mishna})\n\nორიგინალი:\n${item.hebrew}\n\nქართული თარგმანი:\n${item.georgian}\n\nბარტანურა:\n${item.bartenura}`;
    
    navigator.clipboard.writeText(textToCopy).then(() => {
        alert('მიშნა დაკოპირდა ბუფერში! 📋');
    });
}

let isScrolling = false;
let lastActiveCard = null;

function updateActiveMishnaOnScroll() {
    const cards = document.querySelectorAll('.mishna-card');
    if (cards.length === 0) return;

    let currentCard = cards[0];
    const triggerBottom = window.innerHeight / 3;

    for (let card of cards) {
        const box = card.getBoundingClientRect();
        if (box.top <= triggerBottom) {
            currentCard = card;
        } else {
            break;
        }
    }

    if (currentCard !== lastActiveCard) {
        lastActiveCard = currentCard;
        
        const id = parseInt(currentCard.getAttribute('data-id'));
        const seder = currentCard.getAttribute('data-seder');
        const masekhet = currentCard.getAttribute('data-masekhet');
        const perek = currentCard.getAttribute('data-perek');
        const mishna = currentCard.getAttribute('data-mishna');

        document.getElementById('currentMishnaText').innerText = `${seder} • ტრაქტატი ${masekhet} • თავი ${perek} • მიშნა ${mishna}`;

        localStorage.setItem('mishnaLastRead', JSON.stringify({ id, seder, masekhet, perek, mishna }));

        isUpdatingFromScroll = true;
        updateDropdownsSilently(seder, masekhet, perek, mishna);
        isUpdatingFromScroll = false;
    }
}

function updateDropdownsSilently(seder, masekhet, perek, mishna) {
    const sederSelect = document.getElementById('sederSelect');
    const masekhetSelect = document.getElementById('masekhetSelect');
    const perekSelect = document.getElementById('perekSelect');
    const mishnaSelect = document.getElementById('mishnaSelect');

    if (sederSelect.value !== seder) {
        sederSelect.value = seder;
    }

    if (seder && MISHNA_STRUCTURE[seder]) {
        const masekhtot = Object.keys(MISHNA_STRUCTURE[seder]);
        masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';
        masekhtot.forEach(m => {
            masekhetSelect.innerHTML += `<option value="${m}">${m}</option>`;
        });
        masekhetSelect.disabled = false;
        masekhetSelect.value = masekhet;
    }

    if (seder && masekhet && MISHNA_STRUCTURE[seder]?.[masekhet]) {
        const masekhetData = MISHNA_STRUCTURE[seder][masekhet];
        let totalPerakim = typeof masekhetData === 'object' ? Object.keys(masekhetData).length : masekhetData;
        
        perekSelect.innerHTML = '<option value="">ყველა თავი</option>';
        for (let i = 1; i <= totalPerakim; i++) {
            perekSelect.innerHTML += `<option value="${i}">თავი ${i}</option>`;
        }
        perekSelect.disabled = false;
        perekSelect.value = perek;
    }

    if (perek) {
        let maxMishna = 10;
        const masekhetData = MISHNA_STRUCTURE[seder]?.[masekhet];
        if (typeof masekhetData === 'object' && masekhetData[perek]) {
            maxMishna = masekhetData[perek];
        }
        
        mishnaSelect.innerHTML = '<option value="">ყველა მიშნა</option>';
        for (let i = 1; i <= maxMishna; i++) {
            mishnaSelect.innerHTML += `<option value="${i}">მიშნა ${i}</option>`;
        }
        mishnaSelect.disabled = false;
        mishnaSelect.value = mishna;
    }
}

let lastScrollY = window.scrollY;
let lastScrollTime = Date.now();

window.addEventListener('scroll', () => {
    const currentScrollY = window.scrollY;
    const currentTime = Date.now();
    
    const header = document.getElementById('stickyHeader');
    const diffY = currentScrollY - lastScrollY;
    const diffTime = currentTime - lastScrollTime;

    const speed = diffTime > 0 ? (diffY / diffTime) : 0;

    if (currentScrollY <= 20) {
        header.classList.remove('header-hidden');
    } 
    else if (diffY > 8) {
        header.classList.add('header-hidden');
    } 
    else if (diffY < -50 || speed < -1.8) {
        header.classList.remove('header-hidden');
    }

    lastScrollY = currentScrollY;
    lastScrollTime = currentTime;

    if (!isScrolling) {
        window.requestAnimationFrame(() => {
            updateActiveMishnaOnScroll();
            isScrolling = false;
        });
        isScrolling = true;
    }
});

function switchTab(id, tab) {
    const bartenuraContent = document.getElementById(`content-bartenura-${id}`);
    const kehatiContent = document.getElementById(`content-kehati-${id}`);
    const bartenuraTab = document.getElementById(`tab-bartenura-${id}`);
    const kehatiTab = document.getElementById(`tab-kehati-${id}`);

    if (tab === 'bartenura') {
        bartenuraContent.classList.remove('hidden');
        kehatiContent.classList.add('hidden');
        bartenuraTab.className = "flex-1 py-3 text-xs font-bold text-purple-600 dark:text-purple-400 border-b-2 border-purple-500 bg-white dark:bg-slate-800";
        kehatiTab.className = "flex-1 py-3 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-orange-600";
    } else {
        kehatiContent.classList.remove('hidden');
        bartenuraContent.classList.add('hidden');
        kehatiTab.className = "flex-1 py-3 text-xs font-bold text-orange-600 dark:text-orange-400 border-b-2 border-orange-500 bg-white dark:bg-slate-800";
        bartenuraTab.className = "flex-1 py-3 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-purple-600";
    }
}

function escapeQuotes(str) {
    if (!str) return '';
    return str
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;')
        .replace(/\r?\n|\r/g, ' ');
}

function speakText(text, lang) {
    stopSpeech();
    if (!text) return;

    if (lang === 'he') {
        const cleanText = text.replace(/[\u0591-\u05C7]/g, "");
        const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=iw&client=tw-ob`;
        currentAudio = new Audio(url);
        currentAudio.play().catch(() => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'he-IL';
                window.speechSynthesis.speak(utterance);
            }
        });
    } else {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ka-GE';
            utterance.rate = 0.9;
            
            const voices = window.speechSynthesis.getVoices();
            const kaVoice = voices.find(v => v.lang.includes('ka') || v.lang.includes('GE'));
            if (kaVoice) utterance.voice = kaVoice;

            window.speechSynthesis.speak(utterance);
        }
    }
}

function stopSpeech() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

function showDailyMishna() {
    if (allMishnayot.length === 0) return;
    const randomIndex = Math.floor(Math.random() * allMishnayot.length);
    renderMishnayot([allMishnayot[randomIndex]], true);
}

updateFontScale();
fetchMishnaData();
