<!DOCTYPE html>
<html lang="ka" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>მიშნა - ინტერაქტიული კრებული</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 50: '#fffbf0', 100: '#fef3c7', 200: '#fde68a', 800: '#92400e', 900: '#78350f', 950: '#451a03' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=BPG+GEL+Excelsior&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'BPG GEL Excelsior', sans-serif; }
        .hebrew-text { font-family: 'Alef', serif; direction: rtl; }
        .flip-card { perspective: 1000px; }
        .flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-front, .flip-back { backface-visibility: hidden; }
        .flip-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📜</span>
                <h1 class="text-lg font-black bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">მიშნა</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openQuiz()" class="p-2 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 hover:scale-105 transition" title="ქვიზი">🎯</button>
                <button onclick="openFlashcards()" class="p-2 rounded-xl bg-purple-100 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 hover:scale-105 transition" title="ფლეშ ბარათები">🃏</button>
                <button onclick="showDailyMishna()" class="p-2 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 hover:scale-105 transition" title="დღის მიშნა">🌟</button>
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:scale-105 transition" title="თემა">🌓</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Controls / Filters Section -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-6 space-y-4">
            <!-- Search Bar -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">🔍</span>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ძებნა მიშნებში (ებრაულად, ქართულად)..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>

            <!-- Filters Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">სედარი (კატეგორია)</label>
                    <select id="sederFilter" onchange="onSederChange()" class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="">ყველა სედარი</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">ტრაქტატი</label>
                    <select id="masekhetFilter" onchange="applyFilters()" class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="">ყველა ტრაქტატი</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-1">ფილტრი</label>
                    <select id="specialFilter" onchange="applyFilters()" class="w-full py-2 px-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                        <option value="">ყველა ჩანაწერი</option>
                        <option value="favorites">⭐ რჩეულები</option>
                        <option value="notes">📝 შენიშვნებიანი</option>
                        <option value="highlights">🖍️ მონიშნულები</option>
                    </select>
                </div>
            </div>

            <!-- Action Tools Bar -->
            <div class="flex flex-wrap items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700/50 gap-2">
                <div class="flex items-center gap-2">
                    <button onclick="changeFontSize(1)" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-xs font-bold transition">A+</button>
                    <button onclick="changeFontSize(-1)" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 rounded-lg text-xs font-bold transition">A-</button>
                    <span id="fontIndicator" class="text-xs text-slate-400 font-medium">შრიფტი: 100%</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="resultCount" class="text-xs font-bold text-slate-500 dark:text-slate-400">მოიძებნა: 0</span>
                </div>
            </div>
        </section>
                <!-- Mishnayot Container -->
        <div id="mishnayotContainer" class="space-y-6">
            <!-- Dynamic Mishnayot will be injected here -->
            <div class="text-center py-12 text-slate-400">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent mb-2"></div>
                <p class="text-xs font-semibold">იტვირთება მონაცემები...</p>
            </div>
        </div>

    </main>

    <!-- Modal for Quiz, Flashcards & Daily Mishna -->
    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl border border-slate-200 dark:border-slate-700 relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeModal()" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition">✕</button>
            <div id="modalBody">
                <!-- Modal content injected dynamically -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Core -->
    <script>
        let allMishnayot = [];
        let filteredMishnayot = [];
        let favorites = JSON.parse(localStorage.getItem('mishnaFavorites')) || [];
        let userNotes = JSON.parse(localStorage.getItem('mishnaNotes')) || {};
        let userHighlights = JSON.parse(localStorage.getItem('mishnaHighlights')) || {};
        let currentFontScale = parseFloat(localStorage.getItem('mishnaFontScale')) || 1.0;
        let currentAudio = null;

        const sedarimNames = {
            "Zeraim": "სედერ ზერაიმ (თესლეული)",
            "Moed": "სედერ მოედი (სადღესასწაულო)",
            "Nashim": "სედერ ნაშიმი (ქალები)",
            "Nezikin": "სედერ ნეზიქინი (ზარალები)",
            "Kodoshim": "სედერ კოდაშიმი (სიწმინდეები)",
            "Tohorot": "სედერ ტოჰოროტი (სიტოპაკეტი / განწმენდები)"
        };

        function toggleDarkMode() {
            const html = document.documentElement;
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('mishnaTheme', 'light');
            } else {
                html.classList.add('dark');
                localStorage.setItem('mishnaTheme', 'dark');
            }
        }

        if (localStorage.getItem('mishnaTheme') === 'dark' || (!localStorage.getItem('mishnaTheme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        function changeFontSize(direction) {
            currentFontScale += direction * 0.1;
            if (currentFontScale < 0.8) currentFontScale = 0.8;
            if (currentFontScale > 1.6) currentFontScale = 1.6;
            localStorage.setItem('mishnaFontScale', currentFontScale);
            updateFontScale();
        }

        function updateFontScale() {
            document.getElementById('fontIndicator').innerText = `შრიფტი: ${Math.round(currentFontScale * 100)}%`;
            document.querySelectorAll('.mishna-text-container').forEach(el => {
                el.style.fontSize = `${currentFontScale}rem`;
            });
        }
                async function fetchMishnaData() {
            try {
                const response = await fetch('https://www.sefaria.org/api/index/Mishna');
                const data = await response.json();
                
                // Process Sederim structure from Sefaria API
                // (Assuming standard Sefaria structure or flattened data)
                processSefariaData(data);
            } catch (e) {
                console.error("API Error, using fallback or local data structure", e);
                // Fallback mock data or handler if offline
                document.getElementById('mishnayotContainer').innerHTML = `
                    <div class="text-center py-12 text-slate-500 dark:text-slate-400">
                        <p class="text-sm font-bold">მონაცემების ჩატვირთვა ვერ მოხერხდა.</p>
                        <p class="text-xs mt-1">გთხოვთ შეამოწმოთ ინტერნეტ კავშირი.</p>
                    </div>
                `;
            }
        }

        function processSefariaData(data) {
            // Flattening structure for demonstration purposes
            // In a complete app, this parses Sederim -> Masechtot -> Chapters -> Mishnayot
            allMishnayot = [];
            
            // Example structure processing simulation:
            if (data && data.contents) {
                data.contents.forEach(seder => {
                    const sederEnglishName = seder.category || seder.en;
                    if (seder.works) {
                        seder.works.forEach(work => {
                            allMishnayot.push({
                                id: work.title,
                                masekhet: work.title,
                                seder: sederEnglishName,
                                hebrew: work.hebrewTitle || "משנה",
                                georgian: work.titleTransliterated || work.title,
                                bartenura: "ბარტენურას კომენტარი...",
                                kehati: "ქეჰათის განმარტება..."
                            });
                        });
                    }
                });
            }

            // If empty (e.g. API structure mismatch), populate sample data for testing
            if (allMishnayot.length === 0) {
                allMishnayot = [
                    { id: "berakhot_1_1", masekhet: "ברכות (ბერახოთ)", seder: "Zeraim", hebrew: "מאי קראי קרינן קריאת שמע...?", georgian: "როდიდან კითხულობენ შემას საღამოობით?", bartenura: "მიშნის განმარტება ბარტენურას მიხედვით...", kehati: "დეტალური განმარტება ქეჰათის მიხედვით..." },
                    { id: "shabbat_1_1", masekhet: "שבת (შაბათი)", seder: "Moed", hebrew: "יציאות השבת שתים שהן ארבע בפנים...", georgian: "შაბათის გამოსვლები არის ორი, რომლებიც ოთხია...", bartenura: "შაბათის კანონების შესავალი...", kehati: "ქეჰათის კომენტარი შაბათის ტრაქტატზე..." }
                ];
            }

            populateFilters();
            applyFilters();
        }

        function populateFilters() {
            const sederSelect = document.getElementById('sederFilter');
            sederSelect.innerHTML = '<option value="">ყველა სედარი</option>';
            
            const uniqueSedarim = [...new Set(allMishnayot.map(item => item.seder))];
            uniqueSedarim.forEach(seder => {
                const displayName = sedarimNames[seder] || seder;
                sederSelect.innerHTML += `<option value="${seder}">${displayName}</option>`;
            });

            updateMasekhetFilter();
        }

        function updateMasekhetFilter() {
            const selectedSeder = document.getElementById('sederFilter').value;
            const masekhetSelect = document.getElementById('masekhetFilter');
            masekhetSelect.innerHTML = '<option value="">ყველა ტრაქტატი</option>';

            let filtered = allMishnayot;
            if (selectedSeder) {
                filtered = allMishnayot.filter(item => item.seder === selectedSeder);
            }

            const uniqueMasechtot = [...new Set(filtered.map(item => item.masekhet))];
            uniqueMasechtot.forEach(masekhet => {
                masekhetSelect.innerHTML += `<option value="${masekhet}">${masekhet}</option>`;
            });
        }

        function onSederChange() {
            updateMasekhetFilter();
            applyFilters();
        }
                function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const selectedSeder = document.getElementById('sederFilter').value;
            const selectedMasekhet = document.getElementById('masekhetFilter').value;
            const specialFilter = document.getElementById('specialFilter').value;

            filteredMishnayot = allMishnayot.filter(item => {
                const matchesSearch = !searchQuery || 
                    (item.georgian && item.georgian.toLowerCase().includes(searchQuery)) || 
                    (item.hebrew && item.hebrew.toLowerCase().includes(searchQuery)) ||
                    (item.bartenura && item.bartenura.toLowerCase().includes(searchQuery));
                
                const matchesSeder = !selectedSeder || item.seder === selectedSeder;
                const matchesMasekhet = !selectedMasekhet || item.masekhet === selectedMasekhet;

                let matchesSpecial = true;
                if (specialFilter === 'favorites') {
                    matchesSpecial = favorites.includes(item.id);
                } else if (specialFilter === 'notes') {
                    matchesSpecial = userNotes[item.id] && userNotes[item.id].trim() !== '';
                } else if (specialFilter === 'highlights') {
                    matchesSpecial = userHighlights[item.id];
                }

                return matchesSearch && matchesSeder && matchesMasekhet && matchesSpecial;
            });

            document.getElementById('resultCount').innerText = `მოიძებნა: ${filteredMishnayot.length}`;
            renderMishnayot(filteredMishnayot);
        }

        function renderMishnayot(items, isHighlightMode = false) {
            const container = document.getElementById('mishnayotContainer');
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700">
                        <p class="text-sm font-bold text-slate-500 dark:text-slate-400">ჩანაწერები ვერ მოიძებნა</p>
                        <p class="text-xs text-slate-400 mt-1">სცადეთ სხვა საძიებო ფილტრი</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => {
                const isFav = favorites.includes(item.id);
                const isHigh = userHighlights[item.id];
                const noteText = userNotes[item.id] || '';
                const sederName = sedarimNames[item.seder] || item.seder;

                return `
                    <article class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border ${isHigh ? 'border-amber-400 dark:border-amber-500 bg-amber-50/20 dark:bg-amber-950/10' : 'border-slate-200 dark:border-slate-700'} transition-all">
                        <!-- Card Header -->
                        <div class="flex items-center justify-between mb-3 pb-3 border-b border-slate-100 dark:border-slate-700/50">
                            <div>
                                <span class="inline-block px-2.5 py-1 bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 rounded-lg text-[10px] font-bold mb-1">${sederName}</span>
                                <h3 class="text-sm font-black text-slate-800 dark:text-slate-100">${item.masekhet}</h3>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="toggleHighlight('${item.id}')" class="p-2 rounded-xl text-xs ${isHigh ? 'bg-amber-100 text-amber-600 dark:bg-amber-900 dark:text-amber-300' : 'bg-slate-100 text-slate-400 dark:bg-slate-700'} hover:scale-105 transition" title="მონიშვნა">🖍️</button>
                                <button onclick="toggleFavorite('${item.id}')" class="p-2 rounded-xl text-xs ${isFav ? 'bg-rose-100 text-rose-600 dark:bg-rose-900 dark:text-rose-300' : 'bg-slate-100 text-slate-400 dark:bg-slate-700'} hover:scale-105 transition" title="რჩეული">⭐</button>
                            </div>
                        </div>
                                                <!-- Mishna Text Tabs & Content -->
                        <div class="space-y-4">
                            <!-- Original / Hebrew -->
                            <div class="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">ებრაული დედანი</span>
                                    <button onclick="speakText('${escapeQuotes(item.hebrew)}', 'he')" class="px-2.5 py-1 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-lg text-xs font-bold hover:bg-blue-100 transition">🔊 მოსმენა</button>
                                </div>
                                <div class="hebrew-text text-lg text-right font-serif text-slate-900 dark:text-slate-100 mishna-text-container" style="font-size: ${currentFontScale}rem;">
                                    ${item.hebrew || 'ტექსტი არ არის'}
                                </div>
                            </div>

                            <!-- Georgian Translation -->
                            <div class="bg-slate-50 dark:bg-slate-900/60 p-4 rounded-xl border border-slate-100 dark:border-slate-700/50">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">ქართული თარგმანი</span>
                                    <button onclick="speakText('${escapeQuotes(item.georgian)}', 'ka')" class="px-2.5 py-1 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-lg text-xs font-bold hover:bg-blue-100 transition">🔊 მოსმენა</button>
                                </div>
                                <div class="text-sm font-sans leading-relaxed text-slate-700 dark:text-slate-300 mishna-text-container" style="font-size: ${currentFontScale}rem;">
                                    ${item.georgian || 'თარგმანი არ არის'}
                                </div>
                            </div>

                            <!-- Commentaries Tabs (Bartenura / Kehati) -->
                            <div class="border border-slate-200 dark:border-slate-700 rounded-xl overflow-hidden">
                                <div class="flex border-b border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900">
                                    <button id="tab-bartenura-${item.id}" onclick="switchTab('${item.id}', 'bartenura')" class="flex-1 py-2 text-xs font-bold text-purple-600 dark:text-purple-400 border-b-2 border-purple-500 bg-white dark:bg-slate-800 transition">ბარტენურა</button>
                                    <button id="tab-kehati-${item.id}" onclick="switchTab('${item.id}', 'kehati')" class="flex-1 py-2 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-orange-600 transition">ქეჰათი</button>
                                </div>
                                <div class="p-4 bg-white dark:bg-slate-800">
                                    <div id="content-bartenura-${item.id}" class="text-xs font-sans leading-relaxed text-slate-600 dark:text-slate-300">
                                        ${item.bartenura || 'კომენტარი არ მოიძებნა'}
                                    </div>
                                    <div id="content-kehati-${item.id}" class="text-xs font-sans leading-relaxed text-slate-600 dark:text-slate-300 hidden">
                                        ${item.kehati || 'განმარტება არ მოიძებნა'}
                                    </div>
                                </div>
                            </div>

                            <!-- Personal Notes Section -->
                            <div class="pt-2">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">პირადი შენიშვნა</label>
                                <textarea onchange="saveNote('${item.id}', this.value)" placeholder="ჩაწერეთ თქვენი შენიშვნა აქ..." 
                                    class="w-full p-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-y">${noteText}</textarea>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }
                function switchTab(id, tab) {
            const bartenuraContent = document.getElementById(`content-bartenura-${id}`);
            const kehatiContent = document.getElementById(`content-kehati-${id}`);
            const bartenuraTab = document.getElementById(`tab-bartenura-${id}`);
            const kehatiTab = document.getElementById(`tab-kehati-${id}`);

            if (tab === 'bartenura') {
                bartenuraContent.classList.remove('hidden');
                kehatiContent.classList.add('hidden');
                bartenuraTab.className = "flex-1 py-2 text-xs font-bold text-purple-600 dark:text-purple-400 border-b-2 border-purple-500 bg-white dark:bg-slate-800 transition";
                kehatiTab.className = "flex-1 py-2 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-orange-600 transition";
            } else {
                kehatiContent.classList.remove('hidden');
                bartenuraContent.classList.add('hidden');
                kehatiTab.className = "flex-1 py-2 text-xs font-bold text-orange-600 dark:text-orange-400 border-b-2 border-orange-500 bg-white dark:bg-slate-800 transition";
                bartenuraTab.className = "flex-1 py-2 text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-purple-600 transition";
            }
        }

        function escapeQuotes(str) {
            if (!str) return '';
            return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\r?\n|\r/g, ' ');
        }

        function speakText(text, lang) {
            stopSpeech();
            if (!text) return;

            if (lang === 'he') {
                const cleanText = text.replace(/[\u0591-\u05C7]/g, "");
                const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=iw&client=tw-ob`;
                currentAudio = new Audio(url);
                currentAudio.play().catch(() => {
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'he-IL';
                        window.speechSynthesis.speak(utterance);
                    }
                });
            } else {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ka-GE';
                    utterance.rate = 0.9;
                    const voices = window.speechSynthesis.getVoices();
                    const kaVoice = voices.find(v => v.lang.includes('ka') || v.lang.includes('GE'));
                    if (kaVoice) utterance.voice = kaVoice;
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        function stopSpeech() {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
        }

        function showDailyMishna() {
            if (allMishnayot.length === 0) return;
            const randomIndex = Math.floor(Math.random() * allMishnayot.length);
            renderMishnayot([allMishnayot[randomIndex]], true);
        }

        function toggleFavorite(id) {
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('mishnaFavorites', JSON.stringify(favorites));
            applyFilters();
        }

        function saveNote(id, text) {
            userNotes[id] = text;
            localStorage.setItem('mishnaNotes', JSON.stringify(userNotes));
        }

        function toggleHighlight(id) {
            userHighlights[id] = !userHighlights[id];
            localStorage.setItem('mishnaHighlights', JSON.stringify(userHighlights));
            applyFilters();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function openQuiz() {
            if (allMishnayot.length === 0) return;
            const randomItem = allMishnayot[Math.floor(Math.random() * allMishnayot.length)];
            let choices = [randomItem.masekhet];
            while(choices.length < 3 && choices.length < allMishnayot.length) {
                let rM = allMishnayot[Math.floor(Math.random() * allMishnayot.length)].masekhet;
                if(rM && !choices.includes(rM)) choices.push(rM);
            }
            choices.sort(() => Math.random() - 0.5);
            document.getElementById('modalBody').innerHTML = `
                <h3 class="text-base font-bold mb-3 text-center text-slate-800 dark:text-slate-100">🎯 რომელ ტრაქტატს ეკუთვნის ეს მიშნა?</h3>
                <div dir="rtl" class="bg-amber-50 dark:bg-amber-950/40 p-3 rounded-xl text-center mb-4 font-serif text-sm text-slate-900 dark:text-slate-100">${randomItem.hebrew || randomItem.georgian}</div>
                <div class="space-y-2">
                    ${choices.map(c => `<button onclick="checkQuizAnswer('${c}', '${randomItem.masekhet}')" class="w-full py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-blue-500 hover:text-white rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 transition">${c}</button>`).join('')}
                </div>
            `;
            document.getElementById('modal').classList.remove('hidden');
        }

        function checkQuizAnswer(selected, correct) {
            if(selected === correct) { alert("🎉 სწორია!"); openQuiz(); } 
            else { alert(`❌ არასწორია. სწორია: ${correct}`); }
        }

        let flashcardIndex = 0;
        function openFlashcards() {
            if (allMishnayot.length === 0) return;
            flashcardIndex = 0;
            renderFlashcard();
            document.getElementById('modal').classList.remove('hidden');
        }

        function renderFlashcard() {
            const item = allMishnayot[flashcardIndex];
            document.getElementById('modalBody').innerHTML = `
                <div class="text-center mb-2 text-xs font-bold text-slate-400">ბარათი ${flashcardIndex + 1} / ${allMishnayot.length}</div>
                <div id="flashCard" onclick="this.classList.toggle('flipped')" class="flip-card w-full h-48 cursor-pointer">
                    <div class="flip-card-inner relative w-full h-full rounded-2xl bg-amber-50 dark:bg-slate-700 p-4 border border-amber-200 dark:border-slate-600 flex items-center justify-center text-center shadow-inner">
                        <div class="flip-front absolute inset-0 p-4 flex items-center justify-center font-serif text-base text-slate-900 dark:text-slate-100" dir="rtl">${item.hebrew || 'ტექსტი არ არის'}</div>
                        <div class="flip-back absolute inset-0 p-4 flex items-center justify-center text-xs font-sans leading-relaxed text-slate-800 dark:text-slate-200">${item.georgian || 'თარგმანი არ არის'}</div>
                    </div>
                </div>
                <p class="text-[10px] text-center text-slate-400 mt-2">დააჭირეთ ბარათს გადმოსაბრუნებლად</p>
                <div class="flex gap-2 mt-4">
                    <button onclick="nextFlashcard(-1)" class="flex-1 py-2 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200">⬅️ წინა</button>
                    <button onclick="nextFlashcard(1)" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold">შემდეგი ➡️</button>
                </div>
            `;
        }

        function nextFlashcard(dir) {
            flashcardIndex = (flashcardIndex + dir + allMishnayot.length) % allMishnayot.length;
            renderFlashcard();
        }

        updateFontScale();
        fetchMishnaData();
    </script>

</body>
</html>
